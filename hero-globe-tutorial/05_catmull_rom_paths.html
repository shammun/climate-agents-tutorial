<!DOCTYPE html>
<!--
  STEP 5 — Catmull-Rom spline paths and arc-length resampling
  ============================================================
  Builds on Step 4.  New topics:
    cr(a,b,c,d,t)   — Catmull-Rom spline evaluation (smooth interpolation)
    buildPath()     — converts waypoints → spline → evenly-spaced 3-D points
    Arc-length resampling  — why and how

  Why not just draw straight lines between the waypoints?
  ───────────────────────────────────────────────────────
  Waypoints like [[24.2,-81.5], [26,-79.7], …] define the SHAPE of the Gulf Stream,
  but the spacing is uneven: some pairs of waypoints are close together (tight bend),
  others are far apart (open stretch).  If we sample the path at equal PARAMETER steps
  we get more particles in the tight sections than the open ones, which looks wrong.

  Arc-length resampling solves this:
  1. Evaluate the spline at many fine steps (the "raw" samples).
  2. Measure the cumulative arc length from the first point.
  3. Re-sample at equally-spaced arc-length positions: each step covers the same
     physical distance along the curve, regardless of local curvature.

  Catmull-Rom spline
  ──────────────────
  Given four control points a, b, c, d and a parameter t ∈ [0,1]:
    cr(a,b,c,d,t) = ½ × ( 2b
                         + (c - a) t
                         + (2a - 5b + 4c - d) t²
                         + (-a + 3b - 3c + d) t³ )

  The key property: the curve PASSES THROUGH b at t=0 and c at t=1.
  This means we can chain segments — in segment [i, i+1], b and c are the
  actual waypoints, while a = waypoint[i-1] and d = waypoint[i+2] act as
  "tension" handles that control the slope at the endpoints.

  For a closed curve (like the Antarctic Circumpolar Current) we wrap the
  indices modulo the number of points.

  IMPORTANT: These paths are hand-drawn approximations, not downloaded data.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 5 — Catmull-Rom Paths</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000510; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #legend { position: fixed; bottom: 16px; left: 16px; color: #cef; font: 12px/1.6 monospace;
              background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 6px; }
  </style>
</head>
<body>
<div id="legend">
  <strong>Ocean current paths (Step 5)</strong><br>
  <span style="color:#f59e0b">●</span> Gulf Stream &amp; N. Atlantic Drift<br>
  <span style="color:#22d3ee">●</span> Kuroshio Current<br>
  <span style="color:#60a5fa">●</span> Antarctic Circumpolar<br>
  <span style="color:#2dd4bf">●</span> Equatorial Counter-Currents<br>
  <span style="color:#7dd3fc">●</span> California / Canary / Humboldt<br>
  <span style="color:#fb923c">●</span> Brazil / East Australia / Somali<br>
  Drag to rotate · all 15 currents shown
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>

<script>

const TEXTURE_URL = '../site/assets/blue_marble.jpg';
const COAST_URL   = 'https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json';
const D2R = Math.PI / 180;

function ll(lat, lon, r) {
  const a = lat * D2R, b = lon * D2R, c = Math.cos(a) * r;
  return [c * Math.cos(b), Math.sin(a) * r, -c * Math.sin(b)];
}

// ── Catmull-Rom basis function ────────────────────────────────────────────────
// Evaluates a 1-D Catmull-Rom spline at parameter t ∈ [0,1].
// a, b, c, d are four consecutive 1-D control values (lat or lon).
//
// The formula comes from the Catmull-Rom cubic matrix formulation:
//   CR = ½ × [[-1  3 -3  1]   × [a]
//              [ 2 -5  4 -1]     [b]
//              [-1  0  1  0]     [c]
//              [ 0  2  0  0]]    [d]
//
// At t=0: result = b   (the curve starts at the second control point)
// At t=1: result = c   (the curve ends at the third control point)
// Between: smooth cubic interpolation, tangent-continuous
function cr(a, b, c, d, t) {
  return 0.5 * (
    2 * b +
    (c - a) * t +
    (2 * a - 5 * b + 4 * c - d) * t * t +
    (3 * b - a - 3 * c + d) * t * t * t
  );
}

// ── buildPath(pts, closed, radius) ───────────────────────────────────────────
// pts    — array of [lat, lon] waypoints
// closed — boolean: if true the path wraps around (Antarctic Circumpolar Current)
// radius — sphere radius; slightly above 1.0 so lines sit on the surface
//
// Returns { pos: Float32Array, m: number, len: number, closed: boolean }
//   pos  — evenly-resampled 3-D positions (m+1 points × 3 floats each)
//   m    — number of intervals (pos has m+1 points)
//   len  — total arc length in 3-D units
function buildPath(pts, closed, radius) {
  // Work in a copy so we can normalise longitude wrapping without mutating the input
  const P = pts.map(p => [p[0], p[1]]);

  // Normalise longitude so consecutive waypoints never jump across the ±180° seam.
  // E.g. if a waypoint is at −170° and the next is at +170°, we convert the second
  // to −190° so the spline interpolates the short way (20°) not the long way (340°).
  for (let i = 1; i < P.length; i++) {
    while (P[i][1] - P[i-1][1] >  180) P[i][1] -= 360;
    while (P[i][1] - P[i-1][1] < -180) P[i][1] += 360;
  }

  const n = P.length;

  // get(i) — index helper that handles both open and closed paths
  const get = i => {
    if (!closed) return P[Math.max(0, Math.min(n - 1, i))]; // clamp to endpoints
    // For closed paths, wrap the index and add 360° per full revolution to keep
    // the longitude monotone for the spline (avoids a 360° jump at the seam)
    const q = P[((i % n) + n) % n];
    return [q[0], q[1] + 360 * Math.floor(i / n)];
  };

  // ── Phase 1: evaluate the spline at SUB=14 sub-steps per segment ─────────────
  // This gives us a dense, non-uniformly-spaced polyline ("raw" samples)
  const raw = [];
  const segs = closed ? n : n - 1;  // closed paths wrap back to the start
  const SUB = 14;
  for (let s = 0; s < segs; s++) {
    const a = get(s - 1), b = get(s), c = get(s + 1), d = get(s + 2);
    for (let j = 0; j < SUB; j++) {
      const t = j / SUB;
      // Evaluate lat and lon independently through the Catmull-Rom basis
      const lat = cr(a[0], b[0], c[0], d[0], t);
      const lon = cr(a[1], b[1], c[1], d[1], t);
      raw.push(ll(lat, lon, radius));
    }
  }
  // Add the last point explicitly
  raw.push(closed ? raw[0] : ll(P[n-1][0], P[n-1][1], radius));

  // ── Phase 2: measure cumulative arc length ────────────────────────────────
  const cum = [0];
  for (let i = 1; i < raw.length; i++) {
    const dx = raw[i][0] - raw[i-1][0];
    const dy = raw[i][1] - raw[i-1][1];
    const dz = raw[i][2] - raw[i-1][2];
    cum.push(cum[i-1] + Math.sqrt(dx*dx + dy*dy + dz*dz));
  }
  const totalLen = cum[cum.length - 1];

  // ── Phase 3: resample to equally spaced arc-length positions ─────────────
  // We want m+1 output points where consecutive points are arc-length / m apart.
  // For each output point, find which raw segment it falls in by binary-searching
  // the cum[] array, then linearly interpolate within that segment.
  const m = Math.max(24, Math.ceil(totalLen / 0.008));
  const pos = new Float32Array((m + 1) * 3);

  for (let i = 0, k = 0; i <= m; i++) {
    const target = totalLen * i / m;
    // Advance k until raw[k..k+1] straddles the target arc length
    while (k < raw.length - 2 && cum[k + 1] < target) k++;
    // Fraction within segment [k, k+1]
    const t = cum[k+1] > cum[k]
      ? Math.max(0, Math.min(1, (target - cum[k]) / (cum[k+1] - cum[k])))
      : 0;
    pos[i*3]   = raw[k][0] + (raw[k+1][0] - raw[k][0]) * t;
    pos[i*3+1] = raw[k][1] + (raw[k+1][1] - raw[k][1]) * t;
    pos[i*3+2] = raw[k][2] + (raw[k+1][2] - raw[k][2]) * t;
  }

  return { pos, m, len: totalLen, closed };
}

// ── All 15 ocean currents — same paths as the live hero section ───────────────
// Hand-drawn approximations of real current centrelines; waypoints are [lat, lon].
const CURRENTS = [
  { name: 'Gulf Stream',
    color: '#f59e0b',
    pts: [[24.2,-81.5],[26,-79.7],[30,-79.5],[33,-77],[35.5,-74.3],[38,-70],[39.5,-64],[40.5,-57],[42,-50],[45,-43],[48,-36]] },
  { name: 'North Atlantic Drift',
    color: '#fbbf24',
    pts: [[48,-34],[51,-26],[55,-18],[59,-10],[62.5,-3],[66,5],[69,12]] },
  { name: 'Kuroshio Current',
    color: '#22d3ee',
    pts: [[16,123.8],[20,122.6],[24,122.8],[27,125.8],[29.5,129.5],[31.5,132.5],[33,136],[34.3,139.5],[35.3,142],[36,147],[35.5,153],[36.5,160],[37.5,168]] },
  { name: 'Antarctic Circumpolar Current',
    color: '#60a5fa', closed: true,
    pts: [[-58,-180],[-59,-160],[-60,-140],[-60,-120],[-60,-100],[-60,-80],[-59,-65],[-56,-55],[-52,-40],[-50,-20],[-50,0],[-49,20],[-48,40],[-48,60],[-50,80],[-51,100],[-53,120],[-55,140],[-57,160]] },
  { name: 'Agulhas Current',
    color: '#a78bfa',
    pts: [[-11.5,51],[-11.5,47],[-13,43.5],[-17,41],[-22,37.5],[-25.5,35],[-29,33],[-32,30.2],[-34.5,26.5],[-36.5,22],[-38.5,18.5],[-40.3,19.5],[-40.5,24],[-39.5,30]] },
  { name: 'Equatorial Counter-Current (Pacific)',
    color: '#2dd4bf',
    pts: [[5,130],[5.5,150],[6,170],[6.5,-170],[7,-150],[7,-130],[6.5,-110],[6,-95],[6,-86]] },
  { name: 'Equatorial Counter-Current (Atlantic)',
    color: '#2dd4bf',
    pts: [[6,-42],[6.5,-34],[6,-26],[5,-18],[4,-10],[3.5,-3],[3.5,3]] },
  { name: 'Equatorial Counter-Current (Indian Ocean)',
    color: '#2dd4bf',
    pts: [[-3,46],[-3.5,56],[-4,66],[-4,76],[-3.5,86],[-3,94]] },
  { name: 'California Current',
    color: '#7dd3fc',
    pts: [[46,-126],[42,-126.5],[38,-125.5],[34,-123],[30,-120],[26,-117],[22,-114]] },
  { name: 'Canary Current',
    color: '#7dd3fc',
    pts: [[40,-13],[36,-13.5],[32,-14],[28,-16.5],[24,-19],[20,-20.5],[16,-22]] },
  { name: 'Brazil Current',
    color: '#fb923c',
    pts: [[-8,-33.5],[-13,-37],[-18,-37.5],[-23,-40],[-27,-45.5],[-31,-48.5],[-36,-52]] },
  { name: 'Labrador Current',
    color: '#bfdbfe',
    pts: [[60,-60],[57,-57.5],[54,-53.5],[51,-51],[48,-48.5],[45,-49.5],[43,-52]] },
  { name: 'Humboldt (Peru) Current',
    color: '#7dd3fc',
    pts: [[-42,-76],[-36,-75],[-30,-73.5],[-24,-72.5],[-18,-73.5],[-12,-79],[-6,-83]] },
  { name: 'East Australian Current',
    color: '#f472b6',
    pts: [[-15,147.5],[-20,151.5],[-25,154.5],[-30,154.3],[-34,152.8],[-37,151.5]] },
  { name: 'Somali Current',
    color: '#c084fc',
    pts: [[-2,42.5],[2,46.5],[6,50],[10,52.5],[13.5,56]] },
];

// ── Renderer, scene, camera ───────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 2.5);

// ── Globe + graticule + atmosphere ────────────────────────────────────────────
const globeMat = new THREE.MeshBasicMaterial({ color: 0x0b2238 });
const globe = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 64), globeMat);
scene.add(globe);
new THREE.TextureLoader().load(TEXTURE_URL, tex => {
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  globeMat.map = tex; globeMat.color.setScalar(0.78); globeMat.needsUpdate = true;
}, undefined, () => {});
{
  const v = [];
  for (let lat = -60; lat <= 60; lat += 30) for (let lon = -180; lon < 180; lon += 3) { v.push(...ll(lat, lon, 1.002)); v.push(...ll(lat, lon+3, 1.002)); }
  for (let lon = -180; lon < 180; lon += 30) for (let lat = -87; lat < 87; lat += 3) { v.push(...ll(lat, lon, 1.002)); v.push(...ll(lat+3, lon, 1.002)); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  globe.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x9ccfe8, transparent: true, opacity: 0.13, depthWrite: false })));
}
const atmoVS = 'varying vec3 vN; varying vec3 vP; void main() { vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vP = mv.xyz; gl_Position = projectionMatrix * mv; }';
globe.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(1.003, 96, 48), new THREE.ShaderMaterial({ vertexShader: atmoVS, fragmentShader: 'varying vec3 vN; varying vec3 vP; void main() { float f = 1.0 - max(0.0, dot(normalize(vN), normalize(-vP))); gl_FragColor = vec4(0.35, 0.68, 1.0, pow(f, 2.6) * 0.75); }', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })), { renderOrder: 1 }));
scene.add(Object.assign(new THREE.Mesh(new THREE.SphereGeometry(1.2, 96, 48), new THREE.ShaderMaterial({ vertexShader: atmoVS, fragmentShader: 'varying vec3 vN; varying vec3 vP; void main() { float d = max(0.0, -dot(normalize(vN), normalize(-vP))); gl_FragColor = vec4(0.22, 0.6, 1.0, pow(clamp(d * 1.8, 0.0, 1.0), 2.4) * 0.85); }', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide })), { renderOrder: 8 }));
fetch(COAST_URL).then(r => r.ok ? r.json() : Promise.reject()).then(topo => {
  const sc = topo.transform.scale, tr = topo.transform.translate, v = [];
  for (const arc of topo.arcs) { let x = 0, y = 0, prev = null; for (const d of arc) { x += d[0]; y += d[1]; const p = ll(y * sc[1] + tr[1], x * sc[0] + tr[0], 1.003); if (prev) v.push(prev[0],prev[1],prev[2],p[0],p[1],p[2]); prev = p; } }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  globe.add(Object.assign(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x8ff0e0, transparent: true, opacity: 0.32, depthWrite: false })), { renderOrder: 3 }));
}).catch(() => {});

// ── Draw the ocean current paths ──────────────────────────────────────────────
for (const curr of CURRENTS) {
  const path = buildPath(curr.pts, curr.closed, 1.007);

  // The pos Float32Array stores the resampled points as a continuous buffer.
  // Three.js BufferGeometry can use it directly — no copying needed.
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(path.pos, 3));

  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: new THREE.Color(curr.color),
    transparent: true,
    opacity: 0.6,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  }));
  line.renderOrder = 4;
  globe.add(line);
}

// ── Basic drag rotation ───────────────────────────────────────────────────────
let isDragging = false, lastX = 0;
renderer.domElement.addEventListener('pointerdown', e => { isDragging = true; lastX = e.clientX; });
window.addEventListener('pointerup', () => { isDragging = false; });
window.addEventListener('pointermove', e => { if (!isDragging) return; globe.rotation.y += (e.clientX - lastX) / 300; lastX = e.clientX; });

// ── Animation loop ────────────────────────────────────────────────────────────
let last = performance.now();
(function animate(now) {
  requestAnimationFrame(animate);
  if (!isDragging) globe.rotation.y += 0.3 * Math.min(0.05, (now - last) / 1000);
  last = now;
  renderer.render(scene, camera);
})(performance.now());

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
