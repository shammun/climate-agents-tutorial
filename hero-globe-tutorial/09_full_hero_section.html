<!DOCTYPE html>
<!--
  STEP 9 — The complete hero section
  ====================================
  This is the full assembled page, as close as possible to the live site's hero.

  It combines ALL techniques from Steps 1–8:
    Step 1 — WebGLRenderer, scene, camera, animation loop
    Step 2 — Blue Marble texture, colorSpace, anisotropy
    Step 3 — Graticule, GLSL atmosphere rim and halo
    Step 4 — TopoJSON coastlines
    Step 5 — Catmull-Rom spline paths, arc-length resampling
    Step 6 — Animated glowing particles with fading tails
    Step 7 — Direction arrows, trade winds, jet streams
    Step 8 — Drag + inertia, hover tooltips, prefers-reduced-motion

  Plus the full hero CSS overlay:
    - Two-group rotation (tilt + spin)
    - Globe belt labels (trade winds, jet stream)
    - IntersectionObserver to pause when off screen
    - visibilitychange to pause when tab is hidden
    - ResizeObserver for responsive sizing
    - Stars backdrop (static particle backdrop)

  All 15 ocean current paths are included, using the exact waypoints from
  the live site's app.js.  The jet stream meanders are procedurally generated.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Step 9 — Full Hero Section</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font: 16px/1.6 system-ui, -apple-system, sans-serif; background: #000510; }

    /* ── Hero section ─────────────────────────────────────────────────────── */
    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      min-height: 500px;
      overflow: hidden;
      cursor: grab;
      background: linear-gradient(160deg, #0c3a52 0%, #0369a1 30%, #0891b2 60%, #0e7490 85%, #134e5e 100%);
    }
    .hero.is-dragging { cursor: grabbing; }

    /* Canvas fills the hero; pointer-events:none so the text overlay receives events */
    #globeCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }
    #globeCanvas.is-ready { opacity: 1; }

    /* Vignette — dark edge around the hero to frame the globe */
    .hero-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 55%, rgba(6,40,65,.68) 100%);
      pointer-events: none;
    }

    /* Belt labels (trade winds, jet stream) */
    .globe-labels {
      position: absolute; inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .globe-label {
      position: absolute;
      font: 500 10px/1 system-ui, sans-serif;
      color: rgba(255, 220, 100, 0.65);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }
    .globe-label.jet { color: rgba(253, 233, 176, 0.5); }

    /* Hover tooltip */
    .globe-tip {
      position: absolute; top: 0; left: 0;
      background: rgba(6, 45, 70, 0.92);
      border: 1px solid rgba(100, 200, 255, 0.25);
      border-radius: 10px;
      padding: 8px 14px 9px;
      color: #e8f4ff;
      font: 13px/1.5 system-ui, sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      max-width: 230px;
      z-index: 10;
    }
    .globe-tip.show { opacity: 1; }
    .tip-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .tip-desc { display: block; font-size: 11px; color: #aacce0; margin-top: 2px; }

    /* Hero content overlay */
    .hero-content {
      position: relative; z-index: 5;
      text-align: center;
      padding: 24px 24px 48px;
      max-width: 680px;
      pointer-events: none;  /* let drag events fall through to the hero */
    }
    .hero-content a, .hero-content button { pointer-events: auto; }

    .eyebrow { font: 600 12px/1 system-ui, sans-serif; color: #7dd3fc; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 16px; }
    .hero-title { font: 800 clamp(26px, 5vw, 52px)/1.1 system-ui, sans-serif; color: #fff; margin: 0 0 20px; }
    .hero-sub { font: 400 clamp(15px, 2vw, 19px)/1.6 system-ui, sans-serif; color: rgba(255,255,255,.75); margin: 0 0 32px; }

    .hero-btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 20px; }

      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 22px; border-radius: 8px; font: 600 14px/1 system-ui, sans-serif;
      cursor: pointer; text-decoration: none; transition: transform 0.15s, box-shadow 0.15s; border: none;
    }

    .btn.primary { background: #0891b2; color: #fff; }
    .btn-outline { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.25); }

    .byline { font: 400 13px/1 system-ui, sans-serif; color: rgba(255,255,255,.45); }
    .byline a { color: rgba(255,255,255,.65); }

<script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>

<script>

// ── Settings ──────────────────────────────────────────────────────────────────
const TEXTURE_URL = '../site/assets/blue_marble.jpg';
const COAST_URL   = 'https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json';
const D2R = Math.PI / 180;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => { const t = clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── ll(lat, lon, r) — step 3 ─────────────────────────────────────────────────
function ll(lat, lon, r) {
  const a = lat * D2R, b = lon * D2R, c = Math.cos(a) * r;
  return [c * Math.cos(b), Math.sin(a) * r, -c * Math.sin(b)];
}

// ── Catmull-Rom + buildPath — step 5 ─────────────────────────────────────────
function cr(a,b,c,d,t){return 0.5*(2*b+(c-a)*t+(2*a-5*b+4*c-d)*t*t+(3*b-a-3*c+d)*t*t*t);}
function buildPath(pts,closed,radius){
  const P=pts.map(p=>[p[0],p[1]]);
  for(let i=1;i<P.length;i++){while(P[i][1]-P[i-1][1]>180)P[i][1]-=360;while(P[i][1]-P[i-1][1]<-180)P[i][1]+=360;}
  const n=P.length,get=i=>{if(!closed)return P[clamp(i,0,n-1)];const q=P[((i%n)+n)%n];return[q[0],q[1]+360*Math.floor(i/n)];};
  const raw=[],segs=closed?n:n-1,SUB=14;
  for(let s=0;s<segs;s++){const a=get(s-1),b=get(s),c=get(s+1),d=get(s+2);for(let j=0;j<SUB;j++)raw.push(ll(cr(a[0],b[0],c[0],d[0],j/SUB),cr(a[1],b[1],c[1],d[1],j/SUB),radius));}
  raw.push(closed?raw[0]:ll(P[n-1][0],P[n-1][1],radius));
  const cum=[0];for(let i=1;i<raw.length;i++)cum.push(cum[i-1]+Math.hypot(raw[i][0]-raw[i-1][0],raw[i][1]-raw[i-1][1],raw[i][2]-raw[i-1][2]));
  const len=cum[cum.length-1],m=Math.max(24,Math.ceil(len/0.008)),pos=new Float32Array((m+1)*3);
  for(let i=0,k=0;i<=m;i++){const target=len*i/m;while(k<raw.length-2&&cum[k+1]<target)k++;const t=cum[k+1]>cum[k]?clamp((target-cum[k])/(cum[k+1]-cum[k]),0,1):0;for(let c=0;c<3;c++)pos[i*3+c]=raw[k][c]+(raw[k+1][c]-raw[k][c])*t;}
  return{pos,m,len,closed};
}
function samplePath(path,s,out,o){const f=clamp(s,0,1)*path.m,i=Math.min(Math.floor(f),path.m-1),t=f-i,p=path.pos;out[o]=p[i*3]+(p[i*3+3]-p[i*3])*t;out[o+1]=p[i*3+1]+(p[i*3+4]-p[i*3+1])*t;out[o+2]=p[i*3+2]+(p[i*3+5]-p[i*3+2])*t;}

// ── ALL 15 OCEAN CURRENTS — exact waypoints from the live site ─────────────
const FLOWS = [
  { name: 'Gulf Stream', desc: 'Warm western boundary current of the North Atlantic.',
    color: '#f59e0b', speed: 0.10,
    pts: [[24.2,-81.5],[26,-79.7],[30,-79.5],[33,-77],[35.5,-74.3],[38,-70],[39.5,-64],[40.5,-57],[42,-50],[45,-43],[48,-36]] },
  { name: 'North Atlantic Drift', desc: 'Warm extension of the Gulf Stream toward north-west Europe.',
    color: '#fbbf24', speed: 0.05,
    pts: [[48,-34],[51,-26],[55,-18],[59,-10],[62.5,-3],[66,5],[69,12]] },
  { name: 'Kuroshio Current', desc: 'Warm western boundary current of the North Pacific.',
    color: '#22d3ee', speed: 0.09,
    pts: [[16,123.8],[20,122.6],[24,122.8],[27,125.8],[29.5,129.5],[31.5,132.5],[33,136],[34.3,139.5],[35.3,142],[36,147],[35.5,153],[36.5,160],[37.5,168]] },
  { name: 'Antarctic Circumpolar Current', desc: 'Flows east around Antarctica; the largest current on Earth by volume.',
    color: '#60a5fa', speed: 0.05, closed: true,
    pts: [[-58,-180],[-59,-160],[-60,-140],[-60,-120],[-60,-100],[-60,-80],[-59,-65],[-56,-55],[-52,-40],[-50,-20],[-50,0],[-49,20],[-48,40],[-48,60],[-50,80],[-51,100],[-53,120],[-55,140],[-57,160]] },
  { name: 'Agulhas Current', desc: 'Warm western boundary current of the south-west Indian Ocean; it turns back east south of Africa.',
    color: '#a78bfa', speed: 0.085,
    pts: [[-11.5,51],[-11.5,47],[-13,43.5],[-17,41],[-22,37.5],[-25.5,35],[-29,33],[-32,30.2],[-34.5,26.5],[-36.5,22],[-38.5,18.5],[-40.3,19.5],[-40.5,24],[-39.5,30]] },
  { name: 'Equatorial Counter-Current', desc: 'Flows east between the two westward equatorial currents (Pacific branch).',
    color: '#2dd4bf', speed: 0.04,
    pts: [[5,130],[5.5,150],[6,170],[6.5,-170],[7,-150],[7,-130],[6.5,-110],[6,-95],[6,-86]] },
  { name: 'Equatorial Counter-Current', desc: 'Flows east between the two westward equatorial currents (Atlantic branch).',
    color: '#2dd4bf', speed: 0.04,
    pts: [[6,-42],[6.5,-34],[6,-26],[5,-18],[4,-10],[3.5,-3],[3.5,3]] },
  { name: 'Equatorial Counter-Current', desc: 'Flows east just south of the equator (Indian Ocean branch).',
    color: '#2dd4bf', speed: 0.04,
    pts: [[-3,46],[-3.5,56],[-4,66],[-4,76],[-3.5,86],[-3,94]] },
  { name: 'California Current', desc: 'Cold eastern boundary current; flows south along western North America.',
    color: '#7dd3fc', speed: 0.045,
    pts: [[46,-126],[42,-126.5],[38,-125.5],[34,-123],[30,-120],[26,-117],[22,-114]] },
  { name: 'Canary Current', desc: 'Cold eastern boundary current; flows south along north-west Africa.',
    color: '#7dd3fc', speed: 0.045,
    pts: [[40,-13],[36,-13.5],[32,-14],[28,-16.5],[24,-19],[20,-20.5],[16,-22]] },
  { name: 'Brazil Current', desc: 'Warm western boundary current of the South Atlantic; flows south.',
    color: '#fb923c', speed: 0.06,
    pts: [[-8,-33.5],[-13,-37],[-18,-37.5],[-23,-40],[-27,-45.5],[-31,-48.5],[-36,-52]] },
  { name: 'Labrador Current', desc: 'Cold current; flows south from the Arctic past Labrador and Newfoundland.',
    color: '#bfdbfe', speed: 0.05,
    pts: [[60,-60],[57,-57.5],[54,-53.5],[51,-51],[48,-48.5],[45,-49.5],[43,-52]] },
  { name: 'Humboldt (Peru) Current', desc: 'Cold eastern boundary current; flows north along western South America.',
    color: '#7dd3fc', speed: 0.045,
    pts: [[-42,-76],[-36,-75],[-30,-73.5],[-24,-72.5],[-18,-73.5],[-12,-79],[-6,-83]] },
  { name: 'East Australian Current', desc: 'Warm western boundary current of the South Pacific; flows south.',
    color: '#f472b6', speed: 0.07,
    pts: [[-15,147.5],[-20,151.5],[-25,154.5],[-30,154.3],[-34,152.8],[-37,151.5]] },
  { name: 'Somali Current', desc: 'Seasonal: reverses with the monsoon. Shown in its northward summer state.',
    color: '#c084fc', speed: 0.08,
    pts: [[-2,42.5],[2,46.5],[6,50],[10,52.5],[13.5,56]] },
];

// ── Jet streams — procedural sinusoidal meanders ──────────────────────────────
const JET_DESC = 'Fast westerly winds near 10 km altitude that meander around the globe.';
[[-3, 0.92], [0, 1], [3, 0.92]].forEach(([dLat, gain]) => {
  const north = [], south = [];
  for (let lon = -180; lon < 180; lon += 10) {
    const r = lon * Math.PI / 180;
    north.push([49 + dLat + 8 * Math.sin(4 * r + 0.6) + 3 * Math.sin(2 * r), lon]);
    south.push([-51 + dLat + 5 * Math.sin(3 * r + 1.2), lon]);
  }
  FLOWS.push({ name: 'Polar jet stream', desc: JET_DESC, color: '#fde9b0', speed: 0.3, closed: true, jet: true, gain, pts: north });
  FLOWS.push({ name: 'Polar jet stream', desc: JET_DESC, color: '#fde9b0', speed: 0.3, closed: true, jet: true, gain, pts: south });
});

const TRADE = { color: '#fbbf24', degPerSec: 18, latFrom: 24, latTo: 10, dLon: 40 };
const TRADE_TIPS = {
  n: { name: 'Trade winds (north-east)', desc: 'Steady surface winds that blow from the north-east toward the equator.' },
  s: { name: 'Trade winds (south-east)', desc: 'Steady surface winds that blow from the south-east toward the equator.' },
};
const LABELS = [
  { text: 'Trade winds', lat: 17, lon: -45 }, { text: 'Trade winds', lat: 17, lon: -150 },
  { text: 'Trade winds', lat: 17, lon: 140 }, { text: 'Trade winds', lat: -17, lon: -105 },
  { text: 'Trade winds', lat: -17, lon: -12 }, { text: 'Trade winds', lat: -17, lon: 78 },
  { text: 'Polar jet stream', lat: 56, lon: -35, jet: true }, { text: 'Polar jet stream', lat: 56, lon: 150, jet: true },
  { text: 'Polar jet stream', lat: -57, lon: 95, jet: true }, { text: 'Polar jet stream', lat: -57, lon: -120, jet: true },
];

// ── Renderer ──────────────────────────────────────────────────────────────────
const hero   = document.getElementById('hero');
const canvas = document.getElementById('globeCanvas');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 0);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 100);
camera.position.set(0, 0, 2.5);

const tilt = new THREE.Group(), spin = new THREE.Group();
tilt.add(spin); scene.add(tilt);
tilt.rotation.x = 0.3;
spin.rotation.y = (-90 + 48) * D2R;  // North Atlantic facing viewer at start

let W = 1, H = 1, globePx = 300, dirty = true;
let raf = 0, visible = true, last = performance.now(), time = 0;

// ── Shared glowing-point material (step 6) ────────────────────────────────────
const scaleU = { value: 1 };
const pointMaterial = () => new THREE.ShaderMaterial({
  uniforms: { uScale: scaleU },
  vertexShader: 'attribute float aSize; attribute float aAlpha; attribute vec3 aColor; uniform float uScale; varying float vA; varying vec3 vC; void main() { vA = aAlpha; vC = aColor; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_PointSize = aSize * uScale; }',
  fragmentShader: 'varying float vA; varying vec3 vC; void main() { float d = length(gl_PointCoord - 0.5) * 2.0; float a = pow(max(0.0, 1.0 - d), 1.8); gl_FragColor = vec4(vC, vA * a); #include <colorspace_fragment> }',
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
const makePoints = (n, order, parent) => {
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(n*3), col = new Float32Array(n*3), size = new Float32Array(n), alpha = new Float32Array(n);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(size, 1));
  g.setAttribute('aAlpha',   new THREE.BufferAttribute(alpha, 1).setUsage(THREE.DynamicDrawUsage));
  const p = new THREE.Points(g, pointMaterial()); p.frustumCulled = false; p.renderOrder = order; parent.add(p);
  return { g, pos, col, size, alpha };
};

// ── Stars (static backdrop) ───────────────────────────────────────────────────
{
  let seed = 20261113;
  const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const n = 260, s = makePoints(n, -1, scene);
  for (let i = 0; i < n; i++) {
    s.pos.set([(rand()-0.5)*120, (rand()-0.5)*40, -40-rand()*10], i*3);
    const w = 0.75 + rand()*0.25; s.col.set([w,w,1], i*3);
    s.size[i] = 1.4 + rand()*2.2; s.alpha[i] = 0.2 + rand()*0.6;
  }
}

// ── Globe mesh ────────────────────────────────────────────────────────────────
const globeMat = new THREE.MeshBasicMaterial({ color: 0x0b2238 });
spin.add(new THREE.Mesh(new THREE.SphereGeometry(1, 128, 64), globeMat));

// ── Graticule ─────────────────────────────────────────────────────────────────
{
  const v = [];
  for (let lat=-60; lat<=60; lat+=30) for (let lon=-180; lon<180; lon+=3) { v.push(...ll(lat,lon,1.002)); v.push(...ll(lat,lon+3,1.002)); }
  for (let lon=-180; lon<180; lon+=30) for (let lat=-87; lat<87; lat+=3) { v.push(...ll(lat,lon,1.002)); v.push(...ll(lat+3,lon,1.002)); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  const m = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x9ccfe8, transparent: true, opacity: 0.13, depthWrite: false }));
  m.renderOrder = 2; spin.add(m);
}

// ── Atmosphere ────────────────────────────────────────────────────────────────
const atmoVS = 'varying vec3 vN; varying vec3 vP; void main() { vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vP = mv.xyz; gl_Position = projectionMatrix * mv; }';
const rim = new THREE.Mesh(new THREE.SphereGeometry(1.003,96,48), new THREE.ShaderMaterial({
  vertexShader: atmoVS, fragmentShader: 'varying vec3 vN; varying vec3 vP; void main() { float f = 1.0 - max(0.0, dot(normalize(vN), normalize(-vP))); gl_FragColor = vec4(0.35, 0.68, 1.0, pow(f, 2.6) * 0.75); }',
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
rim.renderOrder = 1; spin.add(rim);
const halo = new THREE.Mesh(new THREE.SphereGeometry(1.2,96,48), new THREE.ShaderMaterial({
  vertexShader: atmoVS, fragmentShader: 'varying vec3 vN; varying vec3 vP; void main() { float d = max(0.0, -dot(normalize(vN), normalize(-vP))); gl_FragColor = vec4(0.22, 0.6, 1.0, pow(clamp(d * 1.8, 0.0, 1.0), 2.4) * 0.85); }',
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide }));
halo.renderOrder = 8; scene.add(halo);

// ── Coastlines ────────────────────────────────────────────────────────────────
fetch(COAST_URL).then(r => r.ok ? r.json() : Promise.reject()).then(topo => {
  const sc = topo.transform.scale, tr = topo.transform.translate, v = [];
  for (const arc of topo.arcs) { let x=0,y=0,prev=null; for (const d of arc) { x+=d[0];y+=d[1]; const p=ll(y*sc[1]+tr[1],x*sc[0]+tr[0],1.003); if(prev)v.push(prev[0],prev[1],prev[2],p[0],p[1],p[2]); prev=p; } }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  const m = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x8ff0e0, transparent: true, opacity: 0.32, depthWrite: false }));
  m.renderOrder = 3; spin.add(m); dirty = true; schedule();
}).catch(() => {});

// ── Build all flow paths ──────────────────────────────────────────────────────
const TAIL = 14;
const tailFall = Array.from({ length: TAIL }, (_, k) => k === 0 ? 1 : Math.pow(1 - k / TAIL, 1.3) * 0.9);
let seed = 20261113;
const rand = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

let nFlowPts = 0, nArrows = 0;
const flows = FLOWS.map(f => {
  const path = buildPath(f.pts, !!f.closed, f.jet ? 1.035 : 1.007);
  const n = Math.max(3, Math.round(path.len / (f.jet ? 0.2 : 0.085)));
  const tailLen = f.jet ? 0.16 : 0.028 + f.speed * 0.32;
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(path.pos, 3));
  const color = new THREE.Color(f.color);
  const baseOpacity = f.jet ? 0.14 : 0.42;
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: baseOpacity, depthWrite: false, blending: THREE.AdditiveBlending }));
  line.renderOrder = 4; spin.add(line);
  const phases = Array.from({ length: n }, (_, i) => (i + (rand() - 0.5) * 0.5) / n);
  const arrows = f.jet ? (f.gain === 1 ? 4 : 0) : Math.max(1, Math.round(path.len / 0.9));
  const fl = { f, path, n, color, line, baseOpacity, phases, arrows, tailStep: tailLen / TAIL / path.len, offset: nFlowPts, arrowOffset: nArrows };
  nFlowPts += n * TAIL; nArrows += arrows;
  return fl;
});

const flowPts = makePoints(nFlowPts, 6, spin);
flows.forEach(fl => { for (let p=0;p<fl.n;p++) for (let k=0;k<TAIL;k++) { const i=fl.offset+p*TAIL+k; flowPts.col.set([fl.color.r,fl.color.g,fl.color.b],i*3); flowPts.size[i]=(k===0?8:5.2-3.4*k/TAIL)*(fl.f.jet?0.8:1); } });

// ── Trade winds ───────────────────────────────────────────────────────────────
const TT = 9, tradeColor = new THREE.Color(TRADE.color), trades = [];
for (const hemi of [1,-1]) for (let row=0; row<2; row++) for (let lon=-180; lon<180; lon+=5) {
  trades.push({ hemi, lon: lon+row*2.5+(rand()-0.5)*2, lat0: TRADE.latFrom-row*5+(rand()-0.5)*3, phase: rand() });
}
const tradePts = makePoints(trades.length * TT, 5, spin);
for (let i=0; i<trades.length*TT; i++) { const k=i%TT; tradePts.col.set([tradeColor.r,tradeColor.g,tradeColor.b],i*3); tradePts.size[i]=k===0?4.2:3.4-1.8*k/TT; }

// ── Direction arrows ──────────────────────────────────────────────────────────
const arrowPos=new Float32Array(nArrows*9),arrowCol=new Float32Array(nArrows*9),arrowAlpha=new Float32Array(nArrows*3);
const arrowGeo=new THREE.BufferGeometry();
arrowGeo.setAttribute('position',new THREE.BufferAttribute(arrowPos,3).setUsage(THREE.DynamicDrawUsage));
arrowGeo.setAttribute('aColor',new THREE.BufferAttribute(arrowCol,3));
arrowGeo.setAttribute('aAlpha',new THREE.BufferAttribute(arrowAlpha,1).setUsage(THREE.DynamicDrawUsage));
flows.forEach(fl=>{const c=fl.color.clone().lerp(new THREE.Color(0xffffff),0.55);for(let a=0;a<fl.arrows*3;a++)arrowCol.set([c.r,c.g,c.b],(fl.arrowOffset*3+a)*3);});
const arrowMesh=new THREE.Mesh(arrowGeo,new THREE.ShaderMaterial({vertexShader:'attribute vec3 aColor; attribute float aAlpha; varying vec3 vC; varying float vA; void main() { vC = aColor; vA = aAlpha; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',fragmentShader:'varying vec3 vC; varying float vA; void main() { gl_FragColor = vec4(vC, vA); #include <colorspace_fragment> }',transparent:true,depthWrite:false,side:THREE.DoubleSide}));
arrowMesh.frustumCulled=false;arrowMesh.renderOrder=7;spin.add(arrowMesh);
const tmpA=[0,0,0],tmpB=[0,0,0];

// ── Belt labels ───────────────────────────────────────────────────────────────
const labelBox = document.createElement('div');
labelBox.className = 'globe-labels'; labelBox.setAttribute('aria-hidden','true');
const labels = LABELS.map(l => {
  const el = document.createElement('span'); el.className = 'globe-label' + (l.jet ? ' jet' : '');
  el.textContent = l.text; el.style.opacity = '0'; labelBox.appendChild(el);
  return { el, v: new THREE.Vector3(...ll(l.lat, l.lon, l.jet ? 1.035 : 1.012)) };
});
hero.insertBefore(labelBox, hero.querySelector('.hero-content'));

// ── Tooltip ───────────────────────────────────────────────────────────────────
const tip     = document.createElement('div'); tip.className = 'globe-tip'; tip.setAttribute('aria-hidden','true');
const tipDot  = document.createElement('span'); tipDot.className = 'tip-dot';
const tipName = document.createElement('span');
const tipDesc = document.createElement('span'); tipDesc.className = 'tip-desc';
tip.append(tipDot, tipName, tipDesc); hero.appendChild(tip);

const v3 = new THREE.Vector3(), inv = new THREE.Matrix4(), ray = new THREE.Raycaster(), unit = new THREE.Sphere(new THREE.Vector3(), 1), ndc = new THREE.Vector2();

function updateLabels() {
  for (const l of labels) {
    v3.copy(l.v).applyMatrix4(spin.matrixWorld);
    const facing = (v3.dot(camera.position) - v3.lengthSq()) / camera.position.length();
    if (facing < 0.25) { l.el.style.opacity = '0'; continue; }
    v3.project(camera);
    l.el.style.opacity = String(Math.min(0.9, (facing - 0.25) * 2.2));
    l.el.style.transform = 'translate(' + ((v3.x * 0.5 + 0.5) * W).toFixed(1) + 'px,' + ((-v3.y * 0.5 + 0.5) * H).toFixed(1) + 'px) translate(-50%,-50%)';
  }
}

// ── Picking ───────────────────────────────────────────────────────────────────
function pick(x, y) {
  let best = null, bestD = 18 * 18;
  for (const fl of flows) {
    const p = fl.path, step = Math.max(1, Math.floor(p.m / 90));
    for (let i = 0; i <= p.m; i += step) {
      v3.fromArray(p.pos, i*3).applyMatrix4(spin.matrixWorld);
      if (v3.dot(camera.position) - v3.lengthSq() < 0.08) continue;
      v3.project(camera);
      const dx=(v3.x*0.5+0.5)*W-x, dy=(-v3.y*0.5+0.5)*H-y, d=dx*dx+dy*dy;
      if (d < bestD) { bestD = d; best = fl; }
    }
  }
  if (best) return { name: best.f.name, desc: best.f.desc, color: best.f.color };
  ndc.set(x/W*2-1, -(y/H)*2+1); ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectSphere(unit, v3)) {
    v3.applyMatrix4(inv.copy(spin.matrixWorld).invert());
    const lat = Math.asin(clamp(v3.y/v3.length(),-1,1))/D2R;
    if (Math.abs(lat) >= 9 && Math.abs(lat) <= 25) return Object.assign({color:TRADE.color}, lat>0?TRADE_TIPS.n:TRADE_TIPS.s);
  }
  return null;
}
let tipTimer = 0;
function showTip(hit, x, y) {
  for (const fl of flows) fl.line.material.opacity = hit && fl.f.name === hit.name ? Math.min(1, fl.baseOpacity * 3) : fl.baseOpacity;
  dirty = true;
  if (!hit) { tip.classList.remove('show'); return; }
  tipDot.style.background = hit.color; tipName.textContent = hit.name; tipDesc.textContent = hit.desc;
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  const tx=clamp(x+16,8,Math.max(8,W-tw-8)), ty=clamp(y-th-14,8,Math.max(8,H-th-8));
  tip.style.transform = 'translate('+tx.toFixed(0)+'px,'+ty.toFixed(0)+'px)';
  tip.classList.add('show');
}

// ── updateFlows ───────────────────────────────────────────────────────────────
function updateFlows(time) {
  for (const fl of flows) {
    const path=fl.path, adv=time*fl.f.speed/path.len, gain=fl.f.gain||1;
    for (let p=0;p<fl.n;p++) {
      let s0=(fl.phases[p]+adv)%1; if(s0<0)s0+=1;
      for (let k=0;k<TAIL;k++) {
        const i=fl.offset+p*TAIL+k; let s=s0-k*fl.tailStep, a=tailFall[k]*gain;
        if(path.closed)s-=Math.floor(s); else if(s<0){s=0;a=0;}else a*=smooth(0,0.1,s)*(1-smooth(0.9,1,s));
        samplePath(path,s,flowPts.pos,i*3); flowPts.alpha[i]=a;
      }
    }
    const L=fl.f.jet?0.032:0.026, AW=L*0.4;
    for (let a=0;a<fl.arrows;a++) {
      const s=((a+0.5)/fl.arrows+adv*0.4)%1;
      const fade=path.closed?1:smooth(0.04,0.22,s)*(1-smooth(0.78,0.96,s));
      const ds=L/path.len;
      samplePath(path,clamp(s-ds*0.5,0,1),tmpA,0); samplePath(path,clamp(s+ds*0.5,0,1),tmpB,0);
      let tx=tmpB[0]-tmpA[0],ty=tmpB[1]-tmpA[1],tz=tmpB[2]-tmpA[2];
      const tl=Math.hypot(tx,ty,tz)||1; tx/=tl;ty/=tl;tz/=tl;
      const cx=(tmpA[0]+tmpB[0])/2,cy=(tmpA[1]+tmpB[1])/2,cz=(tmpA[2]+tmpB[2])/2;
      let sx=cy*tz-cz*ty,sy=cz*tx-cx*tz,sz=cx*ty-cy*tx;
      const sl=Math.hypot(sx,sy,sz)||1; sx/=sl;sy/=sl;sz/=sl;
      const o=(fl.arrowOffset+a)*9, lift=1.004;
      arrowPos[o]=(cx+tx*L*0.6)*lift;arrowPos[o+1]=(cy+ty*L*0.6)*lift;arrowPos[o+2]=(cz+tz*L*0.6)*lift;
      arrowPos[o+3]=(cx-tx*L*0.4+sx*AW)*lift;arrowPos[o+4]=(cy-ty*L*0.4+sy*AW)*lift;arrowPos[o+5]=(cz-tz*L*0.4+sz*AW)*lift;
      arrowPos[o+6]=(cx-tx*L*0.4-sx*AW)*lift;arrowPos[o+7]=(cy-ty*L*0.4-sy*AW)*lift;arrowPos[o+8]=(cz-tz*L*0.4-sz*AW)*lift;
      const al=fade*(0.8+0.2*Math.sin(time*2.4+a)), ao=(fl.arrowOffset+a)*3;
      arrowAlpha[ao]=arrowAlpha[ao+1]=arrowAlpha[ao+2]=al;
    }
  }
  flowPts.g.attributes.position.needsUpdate=true;flowPts.g.attributes.aAlpha.needsUpdate=true;
  arrowGeo.attributes.position.needsUpdate=true;arrowGeo.attributes.aAlpha.needsUpdate=true;

  const rate=TRADE.degPerSec/TRADE.dLon, dLat=TRADE.latFrom-TRADE.latTo;
  for (let j=0;j<trades.length;j++) {
    const tw=trades[j], t0=(tw.phase+time*rate)%1;
    for (let k=0;k<TT;k++) {
      const i=j*TT+k, t=t0-k*0.016;
      if(t<0){tradePts.alpha[i]=0;continue;}
      tradePts.pos.set(ll(tw.hemi*(tw.lat0-dLat*t),tw.lon-TRADE.dLon*t,1.012),i*3);
      tradePts.alpha[i]=Math.sin(Math.PI*t)*Math.pow(1-k/TT,1.4)*0.8;
    }
  }
  tradePts.g.attributes.position.needsUpdate=true;tradePts.g.attributes.aAlpha.needsUpdate=true;
}

// ── Pointer events ────────────────────────────────────────────────────────────
const AUTO = reduced ? 0 : 0.072;
let vel=AUTO, dragging=false, moved=0, lastX2=0, lastY2=0, lastT=0, pointerId=null;
const isCtrl=t=>!!(t&&t.closest&&t.closest('a,button'));
const local=e=>{const r=hero.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};

hero.addEventListener('pointerdown', e=>{if(isCtrl(e.target)||(e.pointerType==='mouse'&&e.button!==0))return;dragging=true;moved=0;pointerId=e.pointerId;lastX2=e.clientX;lastY2=e.clientY;lastT=performance.now();try{hero.setPointerCapture(e.pointerId);}catch{}hero.classList.add('is-dragging');});
hero.addEventListener('pointermove', e=>{if(dragging&&e.pointerId===pointerId){const dx=e.clientX-lastX2,dy=e.clientY-lastY2,now=performance.now(),k=1/globePx;moved+=Math.abs(dx)+Math.abs(dy);spin.rotation.y+=dx*k;tilt.rotation.x=clamp(tilt.rotation.x+dy*k,-1.2,1.2);if(!reduced)vel=clamp(dx*k/Math.max(0.008,(now-lastT)/1000),-2.5,2.5);lastX2=e.clientX;lastY2=e.clientY;lastT=now;dirty=true;if(moved>6)showTip(null);schedule();return;}if(e.pointerType==='touch')return;if(isCtrl(e.target)){showTip(null);schedule();return;}const p=local(e);showTip(pick(p[0],p[1]),p[0],p[1]);schedule();});
const endDrag=e=>{if(!dragging||e.pointerId!==pointerId)return;dragging=false;hero.classList.remove('is-dragging');try{hero.releasePointerCapture(e.pointerId);}catch{}if(performance.now()-lastT>120)vel=0;if(e.type==='pointerup'&&moved<=6&&e.pointerType!=='mouse'){const p=local(e);showTip(pick(p[0],p[1]),p[0],p[1]);clearTimeout(tipTimer);tipTimer=setTimeout(()=>{showTip(null);schedule();},2600);}schedule();};
hero.addEventListener('pointerup', endDrag); hero.addEventListener('pointercancel', endDrag);
hero.addEventListener('pointerleave', e=>{if(e.pointerType!=='touch'){showTip(null);schedule();}});

// ── Resize ────────────────────────────────────────────────────────────────────
function resize() {
  W=Math.max(1,hero.clientWidth); H=Math.max(1,hero.clientHeight);
  const pr=Math.min(window.devicePixelRatio||1,2);
  renderer.setPixelRatio(pr); renderer.setSize(W,H,false);
  camera.aspect=W/H;
  const k=Math.tan(22.5*D2R), full=(H/2)/(k*Math.sqrt(2.5*2.5-1));
  globePx=Math.min(full,W*0.62);
  camera.position.z=Math.sqrt(1+Math.pow((H/2)/(globePx*k),2));
  camera.updateProjectionMatrix();
  scaleU.value=pr*clamp(globePx/360,0.6,1.25);
  dirty=true; schedule();
}
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(hero);
else window.addEventListener('resize', resize);

// ── Render loop ───────────────────────────────────────────────────────────────
function frame(now) {
  raf=0;
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now;
  if (!reduced) {
    time+=dt;
    if (!dragging) { spin.rotation.y+=vel*dt; vel+=(AUTO-vel)*Math.min(1,dt*1.5); }
    dirty=true;
  }
  if (dirty) {
    dirty=false; updateFlows(time); renderer.render(scene,camera); updateLabels();
  }
  if (!reduced) schedule();
}
function schedule() { if(!raf&&visible&&!document.hidden)raf=requestAnimationFrame(frame); }

if ('IntersectionObserver' in window) {
  new IntersectionObserver(es=>{visible=es[es.length-1].isIntersecting;last=performance.now();schedule();}).observe(hero);
}
document.addEventListener('visibilitychange', ()=>{last=performance.now();schedule();});

// ── Load texture, then start ──────────────────────────────────────────────────
const ready = () => { canvas.classList.add('is-ready'); dirty=true; schedule(); };
new THREE.TextureLoader().load(TEXTURE_URL, tex=>{
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  globeMat.map=tex; globeMat.color.setScalar(0.78); globeMat.needsUpdate=true;
  ready();
}, undefined, ready);

resize();
</script>

</body>
</html>
