<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combined Wind + Ocean Currents Globe</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #03070f; color: #e0eaf8; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }

  #ui {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; background: rgba(6,13,26,0.78);
    backdrop-filter: blur(6px); z-index: 10;
    font-size: 13px; gap: 10px; flex-wrap: wrap;
  }
  #ui h1 { font-size: 15px; font-weight: 600; white-space: nowrap; }
  #meta  { color: #8ab4d8; font-size: 11px; }
  #controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    color: #e0eaf8; border-radius: 6px; padding: 4px 10px;
    cursor: pointer; font-size: 12px; transition: background 0.15s;
  }
  .btn:hover { background: rgba(255,255,255,0.18); }
  .btn:focus-visible { outline: 2px solid #00d2b4; outline-offset: 2px; }
  .btn.active { background: rgba(0,210,180,0.22); border-color: #00d2b4; color: #00d2b4; }
  .btn.active-orange { background: rgba(255,120,0,0.22); border-color: #ff7800; color: #ffaa44; }

  #legend {
    position: fixed; bottom: 18px; left: 18px; z-index: 10;
    background: rgba(6,13,26,0.78); border-radius: 8px;
    padding: 10px 14px; font-size: 12px; backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.08); min-width: 190px;
  }
  #legend h3 { font-size: 11px; color: #8ab4d8; margin: 0 0 5px; text-transform: uppercase; letter-spacing: .06em; }
  #legend h3 + .bar { margin-bottom: 2px; }
  .bar { height: 8px; border-radius: 4px; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: #8ab4d8; margin: 2px 0 8px; }

  #status { position: fixed; bottom: 18px; right: 18px; z-index: 10; font-size: 12px; color: #8ab4d8; pointer-events: none; text-align: right; }

  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 14px; color: #8ab4d8; z-index: 20; text-align: center; padding: 0 16px;
  }
</style>
</head>
<body>
<div id="ui">
  <div>
    <h1>Winds + Ocean Currents</h1>
    <div id="meta">loading…</div>
  </div>
  <div id="controls">
    <button class="btn active"        id="btnPlay">Pause</button>
    <button class="btn active"        id="btnWind">Wind on</button>
    <button class="btn active-orange" id="btnCurrent">Currents on</button>
    <button class="btn" id="btnFaster">Faster</button>
    <button class="btn" id="btnSlower">Slower</button>
    <button class="btn" id="btnReset">Reset</button>
  </div>
</div>
<div id="legend">
  <h3>Wind 10 m</h3>
  <div class="bar" id="barWind"></div>
  <div class="bar-labels"><span>0</span><span id="maxWind">— m/s</span></div>
  <h3>Ocean current</h3>
  <div class="bar" id="barCurr"></div>
  <div class="bar-labels"><span>0</span><span id="maxCurr">— m/s</span></div>
</div>
<div id="status"></div>
<div id="loading">Loading data…</div>
<canvas id="c" aria-label="Globe with animated trails of annual-mean winds and ocean surface currents"></canvas>

<!-- Plain (non-module) scripts so the page also works when opened directly from disk (file://) -->
<script src="three.global.min.js"></script>
<script src="blue_marble.js"></script>
<script src="flow_globe.js"></script>
<script src="../data/winds.js"></script>
<script src="../data/currents.js"></script>
<script>
const WINDS_URL    = '../data/winds.json';
const CURRENTS_URL = '../data/currents.json';
const { loadData, createGlobe, createFlowLayer, PALETTES } = FlowGlobe;
const $ = id => document.getElementById(id);

const globe = createGlobe({
  canvas: $('c'),
  textureUrl: window.BLUE_MARBLE_DATA_URL,
  view: { lat: 20, lon: -40 },
});

let windLayer = null, currentLayer = null, animating = true, speedScale = 1;
let windMeta = null, currMeta = null, pending = 2;
const errors = [];

function updateText() {
  const parts = [];
  if (windMeta) parts.push(`Winds: ${windMeta.source} ${windMeta.year}`);
  if (currMeta) parts.push(`Currents: ${currMeta.source} ${currMeta.year}`);
  $('meta').textContent = parts.concat(errors).join('  ·  ') || 'loading…';
  $('status').textContent =
    `${windLayer && windLayer.visible ? windLayer.count : 0} wind + ` +
    `${currentLayer && currentLayer.visible ? currentLayer.count : 0} current particles`;
}

function done() {
  if (--pending > 0) return;
  // Hide the overlay once both loads have finished; keep it if both failed.
  if (windLayer || currentLayer) $('loading').style.display = 'none';
  else $('loading').textContent = errors.join(' · ');
  updateText();
}

loadData('WIND_DATA', WINDS_URL)
  .then(data => {
    windMeta = data;
    // Winds sit slightly higher above the surface than currents and are dimmer,
    // so the ocean currents remain readable underneath.
    windLayer = createFlowLayer(globe, data, {
      count: 2200, trail: 14, degPerMs: 0.06, maxStep: 1.2, radius: 1.008,
      palette: PALETTES.wind, colourMax: data.speedMax * 0.8, opacity: 0.6,
    });
    $('barWind').style.background = windLayer.legendCss;
    $('maxWind').textContent = `${(data.speedMax * 0.8).toFixed(0)}+ m/s`;
  })
  .catch(err => { errors.push(`Winds: ${err.message}`); console.error(err); })
  .finally(done);

loadData('CURRENT_DATA', CURRENTS_URL)
  .then(data => {
    currMeta = data;
    currentLayer = createFlowLayer(globe, data, {
      count: 3500, trail: 20, degPerMs: 0.8, speedExponent: 0.5, maxStep: 0.7, radius: 1.003,
      palette: PALETTES.current, colourMax: data.speedMax * 0.6, colourGamma: 0.5,
      minSpeed: 0.02, opacity: 1.0,
    });
    $('barCurr').style.background = currentLayer.legendCss;
    $('maxCurr').textContent = `${(data.speedMax * 0.6).toFixed(1)}+ m/s`;
  })
  .catch(err => { errors.push(`Currents: ${err.message}`); console.error(err); })
  .finally(done);

globe.onFrame(() => {
  if (!animating) return;
  if (windLayer    && windLayer.visible)    windLayer.step(speedScale);
  if (currentLayer && currentLayer.visible) currentLayer.step(speedScale);
});

// ── controls ──────────────────────────────────────────────────────────────
$('btnPlay').addEventListener('click', function () {
  animating = !animating;
  this.textContent = animating ? 'Pause' : 'Play';
  this.classList.toggle('active', animating);
});
$('btnWind').addEventListener('click', function () {
  if (!windLayer) return;
  windLayer.visible = !windLayer.visible;
  this.textContent = windLayer.visible ? 'Wind on' : 'Wind off';
  this.classList.toggle('active', windLayer.visible);
  updateText();
});
$('btnCurrent').addEventListener('click', function () {
  if (!currentLayer) return;
  currentLayer.visible = !currentLayer.visible;
  this.textContent = currentLayer.visible ? 'Currents on' : 'Currents off';
  this.classList.toggle('active-orange', currentLayer.visible);
  updateText();
});
$('btnFaster').addEventListener('click', () => { speedScale = Math.min(4, speedScale * 1.4); });
$('btnSlower').addEventListener('click', () => { speedScale = Math.max(0.1, speedScale / 1.4); });
$('btnReset').addEventListener('click', () => globe.resetView());
</script>
</body>
</html>
