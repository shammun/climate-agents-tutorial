<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Currents Globe — Real GODAS Data</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #03070f; color: #d8eaf8; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }

  #ui {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; background: rgba(4,16,30,0.78);
    backdrop-filter: blur(6px); z-index: 10;
    font-size: 13px; gap: 12px; flex-wrap: wrap;
  }
  #ui h1 { font-size: 15px; font-weight: 600; white-space: nowrap; }
  #meta  { color: #7ab0d4; font-size: 12px; }
  #controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    color: #d8eaf8; border-radius: 6px; padding: 4px 12px;
    cursor: pointer; font-size: 12px; transition: background 0.15s;
  }
  .btn:hover { background: rgba(255,255,255,0.18); }
  .btn:focus-visible { outline: 2px solid #00c8ff; outline-offset: 2px; }
  .btn.active { background: rgba(0,160,220,0.28); border-color: #00a0dc; color: #00c8ff; }

  #legend {
    position: fixed; bottom: 18px; left: 18px; z-index: 10;
    background: rgba(4,16,30,0.78); border-radius: 8px;
    padding: 10px 14px; font-size: 12px; backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.08); min-width: 170px;
  }
  #legend h3 { font-size: 11px; color: #7ab0d4; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
  .bar { height: 8px; border-radius: 4px; }
  .bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: #7ab0d4; margin-top: 3px; }

  #status {
    position: fixed; bottom: 18px; right: 18px; z-index: 10;
    font-size: 12px; color: #7ab0d4; text-align: right; pointer-events: none;
  }
  #hint {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: rgba(200,220,240,0.6); pointer-events: none;
    z-index: 10; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="ui">
  <div>
    <h1>Ocean Surface Currents</h1>
    <div id="meta">loading…</div>
  </div>
  <div id="controls">
    <button class="btn active" id="btnPlay">Pause</button>
    <button class="btn" id="btnFaster">Faster</button>
    <button class="btn" id="btnSlower">Slower</button>
    <button class="btn" id="btnMore">+Particles</button>
    <button class="btn" id="btnFewer">−Particles</button>
    <button class="btn" id="btnReset">Reset view</button>
  </div>
</div>
<div id="hint">Drag to rotate · Scroll to zoom</div>
<div id="legend">
  <h3>Current speed (annual mean, 5 m depth)</h3>
  <div class="bar" id="bar"></div>
  <div class="bar-labels"><span>0</span><span id="barMax">— m/s</span></div>
</div>
<div id="status"></div>
<canvas id="c" aria-label="Globe with animated trails of the annual-mean ocean surface currents"></canvas>

<!-- Plain (non-module) scripts so the page also works when opened directly from disk (file://) -->
<script src="three.global.min.js"></script>
<script src="blue_marble.js"></script>
<script src="flow_globe.js"></script>
<script src="../data/currents.js"></script>
<script>
const DATA_URL = '../data/currents.json';
const { loadData, createGlobe, createFlowLayer, PALETTES } = FlowGlobe;

const globe = createGlobe({
  canvas: document.getElementById('c'),
  textureUrl: window.BLUE_MARBLE_DATA_URL,
  view: { lat: 25, lon: -55 },               // start over the Gulf Stream
});

let layer = null, animating = true, speedScale = 1;
const $ = id => document.getElementById(id);

loadData('CURRENT_DATA', DATA_URL)
  .then(data => {
    // Ocean currents are 10–100× slower than winds (typically 0.05–1 m/s).
    // The step grows with √speed, so slow gyre currents still leave visible
    // streaks while the colour shows the true speed.
    layer = createFlowLayer(globe, data, {
      count: 4000,
      trail: 20,
      degPerMs: 0.8,      // step = 0.8° × √(speed in m/s): 0.1 m/s → 0.25°, 0.5 m/s → 0.57°
      speedExponent: 0.5,
      maxStep: 0.7,       // cap so the Gulf Stream and Agulhas do not streak
      radius: 1.003,
      palette: PALETTES.current,
      colourMax: data.speedMax * 0.6,
      colourGamma: 0.5,   // square-root scale: spreads out the many slow currents
      minSpeed: 0.02,     // only place particles where the current is ≥ 2 cm/s (= ocean)
      opacity: 1.0,
    });
    $('meta').textContent =
      `${data.source} ${data.year} annual mean · ${data.grid.nlat}×${data.grid.nlon} grid · max ${data.speedMax.toFixed(2)} m/s`;
    $('bar').style.background = layer.legendCss;
    $('barMax').textContent = `${(data.speedMax * 0.6).toFixed(1)}+ m/s`;
    $('status').textContent = `${layer.count} particles`;
  })
  .catch(err => {
    $('meta').textContent = `Error: ${err.message}`;
    console.error(err);
  });

globe.onFrame(() => { if (layer && animating) layer.step(speedScale); });

// ── controls ──────────────────────────────────────────────────────────────
$('btnPlay').addEventListener('click', function () {
  animating = !animating;
  this.textContent = animating ? 'Pause' : 'Play';
  this.classList.toggle('active', animating);
});
$('btnFaster').addEventListener('click', () => { speedScale = Math.min(4, speedScale * 1.4); });
$('btnSlower').addEventListener('click', () => { speedScale = Math.max(0.1, speedScale / 1.4); });
$('btnMore').addEventListener('click', () => { if (layer) { layer.setCount(layer.count + 1000); $('status').textContent = `${layer.count} particles`; } });
$('btnFewer').addEventListener('click', () => { if (layer) { layer.setCount(layer.count - 1000); $('status').textContent = `${layer.count} particles`; } });
$('btnReset').addEventListener('click', () => globe.resetView());
</script>
</body>
</html>
