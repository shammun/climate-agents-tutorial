<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean Currents Globe — Real GODAS Data</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #04101e; color: #d8eaf8; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }

  #ui {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; background: rgba(4,16,30,0.78);
    backdrop-filter: blur(6px); z-index: 10;
    font-size: 13px; gap: 12px; flex-wrap: wrap;
  }
  #ui h1 { font-size: 15px; font-weight: 600; white-space: nowrap; }
  #meta  { color: #7ab0d4; font-size: 12px; white-space: nowrap; }
  #controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    color: #d8eaf8; border-radius: 6px; padding: 4px 12px;
    cursor: pointer; font-size: 12px; transition: background 0.15s;
  }
  .btn:hover { background: rgba(255,255,255,0.18); }
  .btn.active { background: rgba(0,160,220,0.28); border-color: #00a0dc; color: #00c8ff; }

  /* colour legend: teal→orange ramp */
  #legend {
    position: fixed; bottom: 18px; left: 18px; z-index: 10;
    background: rgba(4,16,30,0.78); border-radius: 8px;
    padding: 10px 14px; font-size: 12px; backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  #legend h3 { font-size: 11px; color: #7ab0d4; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
  .ramp {
    width: 120px; height: 10px; border-radius: 3px;
    background: linear-gradient(to right, #00d2b4, #0066ff, #ff6600, #ffcc00);
    margin-bottom: 4px;
  }
  .ramp-labels { display: flex; justify-content: space-between; font-size: 10px; color: #7ab0d4; }

  #status {
    position: fixed; bottom: 18px; right: 18px; z-index: 10;
    font-size: 12px; color: #7ab0d4; text-align: right; pointer-events: none;
  }
</style>
</head>
<body>
<div id="ui">
  <div>
    <h1>Ocean Surface Currents</h1>
    <div id="meta">loading…</div>
  </div>
  <div id="controls">
    <button class="btn active" id="btnPlay">Pause</button>
    <button class="btn" id="btnFaster">Faster</button>
    <button class="btn" id="btnSlower">Slower</button>
    <button class="btn" id="btnMore">+Particles</button>
    <button class="btn" id="btnFewer">−Particles</button>
    <button class="btn" id="btnReset">Reset view</button>
  </div>
</div>

<div id="legend">
  <h3>Current speed</h3>
  <div class="ramp"></div>
  <div class="ramp-labels"><span>slow</span><span>fast</span></div>
</div>
<div id="status">0 particles</div>
<canvas id="c"></canvas>

<script type="module">
import * as THREE from './three.module.min.js';

const DATA_URL = '../data/currents.json';

// ── scene ─────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0, 2.6);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sun = new THREE.DirectionalLight(0xaaddff, 0.9);
sun.position.set(4, 2, 2);
scene.add(sun);

// ── globe — deep ocean colour ─────────────────────────────────────────────
const GLOBE_R = 1.0;
const globe = new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_R, 64, 64),
  new THREE.MeshPhongMaterial({
    color: 0x040e1c, emissive: 0x020812,
    specular: 0x1a4466, shininess: 30,
    transparent: true, opacity: 0.97,
  }),
);
scene.add(globe);

// atmosphere ring
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_R * 1.03, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0x002255, transparent: true, opacity: 0.05, side: THREE.BackSide }),
));

// ── drag ─────────────────────────────────────────────────────────────────
const rot = { x: 0.3, y: 0 };
let isDragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('mousedown',  e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
canvas.addEventListener('mousemove',  e => {
  if (!isDragging) return;
  rot.y += (e.clientX - lastX) * 0.005;
  rot.x  = Math.max(-1.4, Math.min(1.4, rot.x + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('touchstart', e => { isDragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchmove',  e => {
  if (!isDragging) return;
  rot.y += (e.touches[0].clientX - lastX) * 0.005;
  rot.x  = Math.max(-1.4, Math.min(1.4, rot.x + (e.touches[0].clientY - lastY) * 0.005));
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', () => isDragging = false);
canvas.addEventListener('wheel', e => {
  camera.position.z = Math.max(1.4, Math.min(5.0, camera.position.z + e.deltaY * 0.002));
  e.preventDefault();
}, { passive: false });

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
animate();

// ── particles ─────────────────────────────────────────────────────────────
const NLAT = 181, NLON = 360;
let N_PARTICLES = 500;
let uField, vField, speedMax;
let positions, ages, maxAge;
let pGeo, pMat, pMesh;
let animating = true, speedScale = 1.0;

function llToXYZ(lat, lon, r) {
  const phi   = (90 - lat) * Math.PI / 180;
  const theta = lon        * Math.PI / 180;
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta),
  );
}

function sampleField(lat, lon) {
  const latIdx = (lat + 90)  / 180 * (NLAT - 1);
  const lonIdx = ((lon % 360 + 360) % 360) / 359 * (NLON - 1);
  const li = Math.floor(latIdx), lf = latIdx - li;
  const lo = Math.floor(lonIdx), lof = lonIdx - lo;
  const li1 = Math.min(li + 1, NLAT - 1);
  const lo1 = (lo + 1) % NLON;
  const idx = r => c => r * NLON + c;
  const u = (1-lf)*(1-lof)*uField[idx(li)(lo)]  + (1-lf)*lof*uField[idx(li)(lo1)] +
              lf*(1-lof)*uField[idx(li1)(lo)] + lf*lof*uField[idx(li1)(lo1)];
  const v = (1-lf)*(1-lof)*vField[idx(li)(lo)]  + (1-lf)*lof*vField[idx(li)(lo1)] +
              lf*(1-lof)*vField[idx(li1)(lo)] + lf*lof*vField[idx(li1)(lo1)];
  return [u, v];
}

function randomParticle(i) {
  // Start only in ocean-ish regions: seed randomly, discard if zero speed after first step
  const phi   = Math.acos(2 * Math.random() - 1);
  const theta = Math.random() * 2 * Math.PI;
  positions[i*3]   = 90  - phi   * 180 / Math.PI;
  positions[i*3+1] = theta * 180 / Math.PI;
  ages[i] = Math.random() * maxAge;
}

function buildParticles() {
  if (pMesh) scene.remove(pMesh);
  positions = new Float32Array(N_PARTICLES * 3);
  ages      = new Float32Array(N_PARTICLES);
  maxAge    = 160;
  for (let i = 0; i < N_PARTICLES; i++) randomParticle(i);

  const posArr = new Float32Array(N_PARTICLES * 3);
  const colArr = new Float32Array(N_PARTICLES * 3);
  for (let i = 0; i < N_PARTICLES; i++) {
    const p = llToXYZ(positions[i*3], positions[i*3+1], GLOBE_R + 0.001);
    posArr[i*3] = p.x; posArr[i*3+1] = p.y; posArr[i*3+2] = p.z;
    colArr[i*3] = 0; colArr[i*3+1] = 0.82; colArr[i*3+2] = 0.7;
  }
  pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  pGeo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));
  pMat  = new THREE.PointsMaterial({ size: 0.0065, vertexColors: true, transparent: true, opacity: 0.9, sizeAttenuation: true });
  pMesh = new THREE.Points(pGeo, pMat);
  scene.add(pMesh);
  document.getElementById('status').textContent = `${N_PARTICLES} particles`;
}

// colour map: slow (teal) → medium (blue) → fast (orange) → peak (yellow)
const COLOUR_STOPS = [
  { t: 0.0,  r: 0.00, g: 0.82, b: 0.70 },
  { t: 0.33, r: 0.00, g: 0.40, b: 1.00 },
  { t: 0.66, r: 1.00, g: 0.40, b: 0.00 },
  { t: 1.0,  r: 1.00, g: 0.80, b: 0.00 },
];
function speedColor(spd) {
  const t = Math.min(1, spd / (speedMax * 0.7));
  let lo = COLOUR_STOPS[0], hi = COLOUR_STOPS[COLOUR_STOPS.length - 1];
  for (let j = 0; j < COLOUR_STOPS.length - 1; j++) {
    if (t >= COLOUR_STOPS[j].t && t <= COLOUR_STOPS[j+1].t) { lo = COLOUR_STOPS[j]; hi = COLOUR_STOPS[j+1]; break; }
  }
  const a = (t - lo.t) / Math.max(1e-6, hi.t - lo.t);
  return { r: lo.r + a*(hi.r-lo.r), g: lo.g + a*(hi.g-lo.g), b: lo.b + a*(hi.b-lo.b) };
}

const DT = 0.12;
function stepParticles() {
  const posAttr = pGeo.getAttribute('position');
  const colAttr = pGeo.getAttribute('color');
  for (let i = 0; i < N_PARTICLES; i++) {
    ages[i]++;
    if (ages[i] > maxAge) randomParticle(i);

    let lat = positions[i*3];
    let lon = positions[i*3+1];
    const [u, v] = sampleField(lat, lon);
    const spd = Math.sqrt(u*u + v*v);

    // Skip land cells (zero speed) — reseed
    if (spd < 0.001 && ages[i] > 5) { ages[i] = maxAge + 1; continue; }

    const cosLat = Math.cos(lat * Math.PI / 180);
    const dLat   = v * DT * speedScale;
    const dLon   = cosLat > 0.02 ? u * DT * speedScale / cosLat : 0;

    lat += dLat;
    lon  = (lon + dLon + 360) % 360;
    if (lat > 90 || lat < -90) { ages[i] = maxAge + 1; continue; }

    positions[i*3]   = lat;
    positions[i*3+1] = lon;

    const p = llToXYZ(lat, lon, GLOBE_R + 0.0015);
    posAttr.setXYZ(i, p.x, p.y, p.z);

    const fade = 1 - ages[i] / maxAge;
    const c    = speedColor(spd);
    colAttr.setXYZ(i, c.r * fade, c.g * fade, c.b * fade);
  }
  posAttr.needsUpdate = true;
  colAttr.needsUpdate = true;
}

// ── data load ─────────────────────────────────────────────────────────────
document.getElementById('meta').textContent = 'Fetching current data…';
fetch(DATA_URL)
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(data => {
    uField   = data.uField;
    vField   = data.vField;
    speedMax = data.speedMax;
    document.getElementById('meta').textContent =
      `${data.source} ${data.year} · ${data.grid.nlat}×${data.grid.nlon} grid · max ${speedMax.toFixed(2)} m/s`;
    buildParticles();
  })
  .catch(err => {
    document.getElementById('meta').textContent = `Error: ${err.message}`;
    console.error(err);
  });

function animate() {
  requestAnimationFrame(animate);
  globe.rotation.x = rot.x; globe.rotation.y = rot.y;
  if (pMesh) { pMesh.rotation.x = rot.x; pMesh.rotation.y = rot.y; }
  if (animating && pMesh && uField) stepParticles();
  renderer.render(scene, camera);
}

// ── controls ──────────────────────────────────────────────────────────────
document.getElementById('btnPlay').addEventListener('click', function() {
  animating = !animating;
  this.textContent = animating ? 'Pause' : 'Play';
  this.classList.toggle('active', animating);
});
document.getElementById('btnFaster').addEventListener('click', () => { speedScale = Math.min(4, speedScale * 1.4); });
document.getElementById('btnSlower').addEventListener('click', () => { speedScale = Math.max(0.1, speedScale / 1.4); });
document.getElementById('btnMore').addEventListener('click', () => { N_PARTICLES = Math.min(3000, N_PARTICLES + 100); buildParticles(); });
document.getElementById('btnFewer').addEventListener('click', () => { N_PARTICLES = Math.max(50, N_PARTICLES - 100); buildParticles(); });
document.getElementById('btnReset').addEventListener('click', () => { rot.x = 0.3; rot.y = 0; camera.position.z = 2.6; });
</script>
</body>
</html>
