<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 536" width="480" height="536" role="img" aria-label="What Claude Code loads at session start, when a task is delegated, when a skill is needed, and when an agent finishes">
<defs>
  <linearGradient id="g-e1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d2e2a"/><stop offset="100%" stop-color="#060f0d"/>
  </linearGradient>
  <linearGradient id="g-e2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0c2244"/><stop offset="100%" stop-color="#060f1e"/>
  </linearGradient>
  <linearGradient id="g-e3" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0a30"/><stop offset="100%" stop-color="#0a0618"/>
  </linearGradient>
  <linearGradient id="g-e4" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2a1800"/><stop offset="100%" stop-color="#150c00"/>
  </linearGradient>
  <linearGradient id="g-circ1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="g-circ2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0369a1"/><stop offset="100%" stop-color="#0c4a6e"/>
  </linearGradient>
  <linearGradient id="g-circ3" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#5b21b6"/>
  </linearGradient>
  <linearGradient id="g-circ4" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#b45309"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="480" height="536" fill="#0d1424" rx="16"/>
<!-- Vertical timeline line with glow -->
<line x1="44" y1="40" x2="44" y2="470" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 5" stroke-opacity="0.5" filter="url(#glow)"/>
<!-- Event 1: Session starts (teal) -->
<circle cx="44" cy="46" r="9" fill="url(#g-circ1)" filter="url(#glow)"/>
<rect x="70" y="20" width="396" height="124" rx="14" fill="url(#g-e1)" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.3"/>
<rect x="70" y="28" width="4" height="108" rx="2" fill="#2dd4bf"/>
<text x="88" y="48" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">Session starts</text>
<text x="96" y="70" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">· CLAUDE.md + imported AGENTS.md (full text)</text>
<text x="96" y="92" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">· name + description of every agent</text>
<text x="96" y="114" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">· name + description of every skill</text>
<!-- Event 2: Task delegated (blue) -->
<circle cx="44" cy="186" r="9" fill="url(#g-circ2)" filter="url(#glow)"/>
<rect x="70" y="160" width="396" height="124" rx="14" fill="url(#g-e2)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
<rect x="70" y="168" width="4" height="108" rx="2" fill="#38bdf8"/>
<text x="88" y="188" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">A task is delegated to an agent</text>
<text x="96" y="210" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">· fresh, empty context</text>
<text x="96" y="232" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">· agent body + project rules</text>
<text x="96" y="254" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">· preloaded skills (skills: list)</text>
<!-- Event 3: Skill needed (purple) -->
<circle cx="44" cy="326" r="9" fill="url(#g-circ3)" filter="url(#glow)"/>
<rect x="70" y="300" width="396" height="104" rx="14" fill="url(#g-e3)" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.3"/>
<rect x="70" y="308" width="4" height="88" rx="2" fill="#a78bfa"/>
<text x="88" y="328" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">A skill is needed</text>
<text x="96" y="350" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">· full SKILL.md text is loaded</text>
<text x="96" y="372" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">· helper scripts run on demand</text>
<!-- Event 4: Agent finishes (amber) -->
<circle cx="44" cy="442" r="9" fill="url(#g-circ4)" filter="url(#glow)"/>
<rect x="70" y="416" width="396" height="104" rx="14" fill="url(#g-e4)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
<rect x="70" y="424" width="4" height="88" rx="2" fill="#f59e0b"/>
<text x="88" y="444" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">The agent finishes</text>
<text x="96" y="466" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">· only its final answer returns</text>
<text x="96" y="488" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">· its working steps stay inside it</text>
</svg>
