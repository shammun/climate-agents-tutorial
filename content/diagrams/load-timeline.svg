<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 536" width="480" height="536" role="img" aria-label="What Claude Code loads at session start, when a task is delegated, when a skill is needed, and when an agent finishes"><style>
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--d-text,#0f172a)}
.m{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--d-muted,#475569)}
.c{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:var(--d-text,#0f172a)}
.b{font-weight:650}
.ln{stroke:var(--d-line,#64748b);stroke-width:2;fill:none}
.acc{stroke:var(--d-acc,#0d9488);stroke-width:2.5;fill:none}
.f0{fill:var(--d-f0,#ffffff);stroke:var(--d-s0,#cbd5e1);stroke-width:1.5}
.f1{fill:var(--d-f1,#f0fdfa);stroke:var(--d-s1,#14b8a6);stroke-width:1.5}
.f2{fill:var(--d-f2,#eff6ff);stroke:var(--d-s2,#60a5fa);stroke-width:1.5}
.f3{fill:var(--d-f3,#fffbeb);stroke:var(--d-s3,#f59e0b);stroke-width:1.5}
.f4{fill:var(--d-f4,#f5f3ff);stroke:var(--d-s4,#a78bfa);stroke-width:1.5}
.f5{fill:var(--d-f5,#fef2f2);stroke:var(--d-s5,#f87171);stroke-width:1.5}
.f6{fill:var(--d-f6,#f8fafc);stroke:var(--d-s0,#cbd5e1);stroke-width:1.5}
.code{fill:var(--d-code,#0f172a)}
.ck{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#7dd3fc}
.cv{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#fde68a}
.cd{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#5eead4}
.cm{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#94a3b8;font-style:italic}
.cb{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#e2e8f0}
.ah{fill:var(--d-line,#64748b)}
.aa{fill:var(--d-acc,#0d9488)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aa"/></marker>
</defs><line x1="44" y1="40" x2="44" y2="470" class="ln" stroke-dasharray="4 6"/><circle cx="44" cy="46" r="9" class="f1"/><rect x="70" y="20" width="396" height="124" rx="14" class="f1"/><text x="88" y="50" class="t b" font-size="16" text-anchor="start">Session starts</text><text x="88" y="76" class="t" font-size="14.5" text-anchor="start">• CLAUDE.md + imported AGENTS.md (full text)</text><text x="88" y="100" class="t" font-size="14.5" text-anchor="start">• name + description of every agent</text><text x="88" y="124" class="t" font-size="14.5" text-anchor="start">• name + description of every skill</text><circle cx="44" cy="186" r="9" class="f2"/><rect x="70" y="160" width="396" height="124" rx="14" class="f2"/><text x="88" y="190" class="t b" font-size="16" text-anchor="start">A task is delegated to an agent</text><text x="88" y="216" class="t" font-size="14.5" text-anchor="start">• fresh, empty context</text><text x="88" y="240" class="t" font-size="14.5" text-anchor="start">• agent body + project rules</text><text x="88" y="264" class="t" font-size="14.5" text-anchor="start">• preloaded skills (skills: list)</text><circle cx="44" cy="326" r="9" class="f4"/><rect x="70" y="300" width="396" height="100" rx="14" class="f4"/><text x="88" y="330" class="t b" font-size="16" text-anchor="start">A skill is needed</text><text x="88" y="356" class="t" font-size="14.5" text-anchor="start">• full SKILL.md text is loaded</text><text x="88" y="380" class="t" font-size="14.5" text-anchor="start">• helper scripts run on demand</text><circle cx="44" cy="442" r="9" class="f3"/><rect x="70" y="416" width="396" height="100" rx="14" class="f3"/><text x="88" y="446" class="t b" font-size="16" text-anchor="start">The agent finishes</text><text x="88" y="472" class="t" font-size="14.5" text-anchor="start">• only its final answer returns</text><text x="88" y="496" class="t" font-size="14.5" text-anchor="start">• its working steps stay inside it</text></svg>
