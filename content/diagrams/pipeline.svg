<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" width="480" height="610" role="img" aria-label="Five-step climate pipeline: download, quality check, analysis, figures, review">
<defs>
  <linearGradient id="g-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0c2244"/>
  </linearGradient>
  <linearGradient id="g-amber" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3d2a0a"/><stop offset="100%" stop-color="#1a1000"/>
  </linearGradient>
  <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2d1b4e"/><stop offset="100%" stop-color="#1a0a30"/>
  </linearGradient>
  <linearGradient id="g-teal" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d2e2a"/><stop offset="100%" stop-color="#051515"/>
  </linearGradient>
  <linearGradient id="g-rose" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3d1a1a"/><stop offset="100%" stop-color="#1a0808"/>
  </linearGradient>
  <linearGradient id="g-badge" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#111827"/><stop offset="100%" stop-color="#0a0f1e"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#2dd4bf"/>
  </marker>
</defs>
<rect width="480" height="610" fill="#0d1424" rx="16"/>
<!-- Step 1: data-fetcher (blue) -->
<rect x="16" y="16" width="250" height="84" rx="14" fill="url(#g-blue)" stroke="#38bdf8" stroke-width="1.5"/>
<circle cx="48" cy="58" r="16" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5"/>
<text x="48" y="63" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">1</text>
<text x="72" y="47" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">data-fetcher</text>
<text x="72" y="70" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">download ERA5</text>
<line x1="266" y1="58" x2="296" y2="58" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<rect x="298" y="38" width="166" height="40" rx="10" fill="url(#g-badge)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="381" y="62" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#38bdf8" text-anchor="middle">data/raw/era5/*.nc</text>
<!-- connector 1→2 -->
<line x1="141" y1="100" x2="141" y2="128" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<!-- Step 2: data-qc (amber) -->
<rect x="16" y="130" width="250" height="84" rx="14" fill="url(#g-amber)" stroke="#f59e0b" stroke-width="1.5"/>
<circle cx="48" cy="172" r="16" fill="#3d2a0a" stroke="#f59e0b" stroke-width="1.5"/>
<text x="48" y="177" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f59e0b" text-anchor="middle">2</text>
<text x="72" y="161" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">data-qc</text>
<text x="72" y="184" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">check the files</text>
<rect x="174" y="140" width="74" height="20" rx="10" fill="#3d1a1a" stroke="#f87171" stroke-width="1"/>
<text x="211" y="154" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="10" fill="#f87171" text-anchor="middle">read-only</text>
<line x1="266" y1="172" x2="296" y2="172" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<rect x="298" y="152" width="166" height="40" rx="10" fill="url(#g-badge)" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3"/>
<text x="381" y="176" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#f59e0b" text-anchor="middle">reports/qc_*.md</text>
<!-- connector 2→3 -->
<line x1="141" y1="214" x2="141" y2="242" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<!-- Step 3: climate-analyst (purple) -->
<rect x="16" y="244" width="250" height="84" rx="14" fill="url(#g-purple)" stroke="#a78bfa" stroke-width="1.5"/>
<circle cx="48" cy="286" r="16" fill="#2d1b4e" stroke="#a78bfa" stroke-width="1.5"/>
<text x="48" y="291" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">3</text>
<text x="72" y="275" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">climate-analyst</text>
<text x="72" y="298" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">JJA mean, trend</text>
<line x1="266" y1="286" x2="296" y2="286" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<rect x="298" y="266" width="166" height="40" rx="10" fill="url(#g-badge)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 3"/>
<text x="381" y="290" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#a78bfa" text-anchor="middle">data/processed/*.nc</text>
<!-- connector 3→4 -->
<line x1="141" y1="328" x2="141" y2="356" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<!-- Step 4: figure-maker (teal) -->
<rect x="16" y="358" width="250" height="84" rx="14" fill="url(#g-teal)" stroke="#2dd4bf" stroke-width="1.5"/>
<circle cx="48" cy="400" r="16" fill="#0d2e2a" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="48" y="405" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">4</text>
<text x="72" y="389" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">figure-maker</text>
<text x="72" y="412" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">map + time series</text>
<line x1="266" y1="400" x2="296" y2="400" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<rect x="298" y="380" width="166" height="40" rx="10" fill="url(#g-badge)" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="4 3"/>
<text x="381" y="404" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#2dd4bf" text-anchor="middle">figures/*.png</text>
<!-- connector 4→5 -->
<line x1="141" y1="442" x2="141" y2="470" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<!-- Step 5: results-reviewer (rose) -->
<rect x="16" y="472" width="250" height="84" rx="14" fill="url(#g-rose)" stroke="#f87171" stroke-width="1.5"/>
<circle cx="48" cy="514" r="16" fill="#3d1a1a" stroke="#f87171" stroke-width="1.5"/>
<text x="48" y="519" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">5</text>
<text x="72" y="503" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">results-reviewer</text>
<text x="72" y="526" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8">independent check</text>
<rect x="174" y="482" width="74" height="20" rx="10" fill="#3d1a1a" stroke="#f87171" stroke-width="1"/>
<text x="211" y="496" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="10" fill="#f87171" text-anchor="middle">read-only</text>
<line x1="266" y1="514" x2="296" y2="514" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<rect x="298" y="494" width="166" height="40" rx="10" fill="url(#g-badge)" stroke="#f87171" stroke-width="1" stroke-dasharray="4 3"/>
<text x="381" y="518" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#f87171" text-anchor="middle">VERDICT: READY</text>
<!-- Caption -->
<text x="240" y="578" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">Each step writes files the next step reads.</text>
</svg>
