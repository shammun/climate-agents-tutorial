<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" width="480" height="610" role="img" aria-label="Five-step climate pipeline: download, quality check, analysis, figures, review"><style>
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--d-text,#0f172a)}
.m{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--d-muted,#475569)}
.c{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:var(--d-text,#0f172a)}
.b{font-weight:650}
.ln{stroke:var(--d-line,#64748b);stroke-width:2;fill:none}
.acc{stroke:var(--d-acc,#0d9488);stroke-width:2.5;fill:none}
.f0{fill:var(--d-f0,#ffffff);stroke:var(--d-s0,#cbd5e1);stroke-width:1.5}
.f1{fill:var(--d-f1,#f0fdfa);stroke:var(--d-s1,#14b8a6);stroke-width:1.5}
.f2{fill:var(--d-f2,#eff6ff);stroke:var(--d-s2,#60a5fa);stroke-width:1.5}
.f3{fill:var(--d-f3,#fffbeb);stroke:var(--d-s3,#f59e0b);stroke-width:1.5}
.f4{fill:var(--d-f4,#f5f3ff);stroke:var(--d-s4,#a78bfa);stroke-width:1.5}
.f5{fill:var(--d-f5,#fef2f2);stroke:var(--d-s5,#f87171);stroke-width:1.5}
.f6{fill:var(--d-f6,#f8fafc);stroke:var(--d-s0,#cbd5e1);stroke-width:1.5}
.code{fill:var(--d-code,#0f172a)}
.ck{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#7dd3fc}
.cv{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#fde68a}
.cd{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#5eead4}
.cm{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#94a3b8;font-style:italic}
.cb{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#e2e8f0}
.ah{fill:var(--d-line,#64748b)}
.aa{fill:var(--d-acc,#0d9488)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aa"/></marker>
</defs><rect x="16" y="16" width="250" height="84" rx="14" class="f2"/><text x="36" y="50" class="t b" font-size="16.5" text-anchor="start">1. data-fetcher</text><text x="36" y="78" class="m" font-size="15" text-anchor="start">download ERA5</text><line x1="266" y1="58" x2="300" y2="58" class="acc" marker-end="url(#aa)"/><rect x="302" y="36" width="166" height="44" rx="10" class="f6"/><text x="385" y="63" class="c" font-size="12.5" text-anchor="middle">data/raw/era5/*.nc</text><line x1="141" y1="100" x2="141" y2="128" class="ln" marker-end="url(#ar)"/><rect x="16" y="130" width="250" height="84" rx="14" class="f3"/><text x="36" y="164" class="t b" font-size="16.5" text-anchor="start">2. data-qc</text><text x="36" y="192" class="m" font-size="15" text-anchor="start">check the files</text><rect x="196" y="138" width="62" height="22" rx="11" class="f6"/><text x="227" y="153" class="m" font-size="10.5" text-anchor="middle">read-only</text><line x1="266" y1="172" x2="300" y2="172" class="acc" marker-end="url(#aa)"/><rect x="302" y="150" width="166" height="44" rx="10" class="f6"/><text x="385" y="177" class="c" font-size="12.5" text-anchor="middle">reports/qc_*.md</text><line x1="141" y1="214" x2="141" y2="242" class="ln" marker-end="url(#ar)"/><rect x="16" y="244" width="250" height="84" rx="14" class="f4"/><text x="36" y="278" class="t b" font-size="16.5" text-anchor="start">3. climate-analyst</text><text x="36" y="306" class="m" font-size="15" text-anchor="start">JJA mean, trend</text><line x1="266" y1="286" x2="300" y2="286" class="acc" marker-end="url(#aa)"/><rect x="302" y="264" width="166" height="44" rx="10" class="f6"/><text x="385" y="291" class="c" font-size="12.5" text-anchor="middle">data/processed/*.nc</text><line x1="141" y1="328" x2="141" y2="356" class="ln" marker-end="url(#ar)"/><rect x="16" y="358" width="250" height="84" rx="14" class="f1"/><text x="36" y="392" class="t b" font-size="16.5" text-anchor="start">4. figure-maker</text><text x="36" y="420" class="m" font-size="15" text-anchor="start">map + time series</text><line x1="266" y1="400" x2="300" y2="400" class="acc" marker-end="url(#aa)"/><rect x="302" y="378" width="166" height="44" rx="10" class="f6"/><text x="385" y="405" class="c" font-size="12.5" text-anchor="middle">figures/*.png</text><line x1="141" y1="442" x2="141" y2="470" class="ln" marker-end="url(#ar)"/><rect x="16" y="472" width="250" height="84" rx="14" class="f5"/><text x="36" y="506" class="t b" font-size="16.5" text-anchor="start">5. results-reviewer</text><text x="36" y="534" class="m" font-size="15" text-anchor="start">independent check</text><rect x="196" y="480" width="62" height="22" rx="11" class="f6"/><text x="227" y="495" class="m" font-size="10.5" text-anchor="middle">read-only</text><line x1="266" y1="514" x2="300" y2="514" class="acc" marker-end="url(#aa)"/><rect x="302" y="492" width="166" height="44" rx="10" class="f6"/><text x="385" y="519" class="c" font-size="12.5" text-anchor="middle">VERDICT: READY</text><text x="240" y="592" class="m" font-size="14" text-anchor="middle">Each step writes files the next step reads.</text></svg>
