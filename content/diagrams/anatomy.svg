<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 446" width="480" height="446" role="img" aria-label="Anatomy of an agent file: YAML frontmatter between two --- lines, then the Markdown body">
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="480" height="446" fill="#0d1424" rx="16"/>
<!-- Code editor panel -->
<rect x="16" y="16" width="300" height="390" rx="12" fill="#060b14" stroke="#1e2d40" stroke-width="1.5"/>
<!-- Header bar -->
<rect x="16" y="16" width="300" height="32" rx="12" fill="#0d1424"/>
<rect x="16" y="40" width="300" height="1" fill="#1e2d40"/>
<!-- macOS dots -->
<circle cx="34" cy="32" r="5" fill="#ff5f57"/>
<circle cx="50" cy="32" r="5" fill="#febc2e"/>
<circle cx="66" cy="32" r="5" fill="#28c840"/>
<text x="166" y="37" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#475569" text-anchor="middle">data-qc.md</text>
<!-- Code lines starting at y=72 with line-height 22 -->
<text x="34" y="72" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5" fill="#5eead4">---</text>
<text x="34" y="94" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5"><tspan fill="#7dd3fc">name:</tspan><tspan fill="#fde68a"> data-qc</tspan></text>
<text x="34" y="116" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5"><tspan fill="#7dd3fc">description:</tspan><tspan fill="#fde68a"> Checks NetCDF</tspan></text>
<text x="34" y="138" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5" fill="#94a3b8">  # (all on one line)</text>
<text x="34" y="160" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5"><tspan fill="#7dd3fc">tools:</tspan><tspan fill="#fde68a"> Read, Grep, Bash</tspan></text>
<text x="34" y="182" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5"><tspan fill="#7dd3fc">model:</tspan><tspan fill="#fde68a"> sonnet</tspan></text>
<text x="34" y="204" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5" fill="#5eead4">---</text>
<!-- blank line, then body -->
<text x="34" y="248" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5" fill="#e2e8f0">You are a climate data</text>
<text x="34" y="270" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5" fill="#e2e8f0">quality-control specialist.</text>
<text x="34" y="314" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5" fill="#38bdf8">## Rules</text>
<text x="34" y="336" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5" fill="#e2e8f0">- Never change files.</text>
<text x="34" y="358" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13.5" fill="#e2e8f0">- Report in a table.</text>
<!-- Frontmatter bracket callout — teal dashed -->
<line x1="322" y1="72" x2="322" y2="204" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="316" y1="72" x2="322" y2="72" stroke="#2dd4bf" stroke-width="1.5"/>
<line x1="316" y1="204" x2="322" y2="204" stroke="#2dd4bf" stroke-width="1.5"/>
<line x1="322" y1="138" x2="342" y2="138" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="346" y="122" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Frontmatter</text>
<text x="346" y="140" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b">settings</text>
<text x="346" y="158" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" fill="#5eead4">key: value</text>
<!-- Body bracket callout -->
<line x1="322" y1="248" x2="322" y2="358" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="316" y1="248" x2="322" y2="248" stroke="#2dd4bf" stroke-width="1.5"/>
<line x1="316" y1="358" x2="322" y2="358" stroke="#2dd4bf" stroke-width="1.5"/>
<line x1="322" y1="303" x2="342" y2="303" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="346" y="293" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Body</text>
<text x="346" y="311" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b">instructions</text>
<text x="346" y="328" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b">(Markdown)</text>
<!-- Caption -->
<text x="240" y="424" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#475569" text-anchor="middle">Line 1 must be exactly ---  ·  one space after each colon</text>
</svg>
