<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 598" width="480" height="598" role="img" aria-label="The four building blocks: project rules, agent definitions, skills and permissions">
<defs>
  <linearGradient id="g-c1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d2e2a"/><stop offset="100%" stop-color="#060f0d"/>
  </linearGradient>
  <linearGradient id="g-c2" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0c2244"/><stop offset="100%" stop-color="#060f1e"/>
  </linearGradient>
  <linearGradient id="g-c3" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0a30"/><stop offset="100%" stop-color="#0a0618"/>
  </linearGradient>
  <linearGradient id="g-c4" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2a0e0e"/><stop offset="100%" stop-color="#150606"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="480" height="598" fill="#0d1424" rx="16"/>
<!-- Card 1: Project rules (teal) -->
<rect x="20" y="14" width="440" height="118" rx="14" fill="url(#g-c1)" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.3"/>
<rect x="20" y="22" width="4" height="102" rx="2" fill="#2dd4bf"/>
<circle cx="52" cy="73" r="16" fill="#0d2e2a" stroke="#2dd4bf" stroke-width="1.5" filter="url(#glow)"/>
<text x="52" y="78" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#2dd4bf" text-anchor="middle">1</text>
<text x="78" y="46" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Project rules</text>
<text x="78" y="66" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" fill="#5eead4">AGENTS.md · CLAUDE.md · GEMINI.md</text>
<text x="78" y="88" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#cbd5e1">briefing sheet for the whole project</text>
<text x="78" y="110" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#475569">loaded: every session</text>
<!-- Card 2: Agent definitions (blue) -->
<rect x="20" y="146" width="440" height="118" rx="14" fill="url(#g-c2)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
<rect x="20" y="154" width="4" height="102" rx="2" fill="#38bdf8"/>
<circle cx="52" cy="205" r="16" fill="#0c2244" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>
<text x="52" y="210" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">2</text>
<text x="78" y="178" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Agent definitions</text>
<text x="78" y="198" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#38bdf8">.claude/agents/*.md · .codex/agents/*.toml</text>
<text x="78" y="220" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#cbd5e1">one specialist: role, tools, model</text>
<text x="78" y="242" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#475569">loaded: when a task is delegated</text>
<!-- Card 3: Skills (purple) -->
<rect x="20" y="278" width="440" height="118" rx="14" fill="url(#g-c3)" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.3"/>
<rect x="20" y="286" width="4" height="102" rx="2" fill="#a78bfa"/>
<circle cx="52" cy="337" r="16" fill="#1a0a30" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow)"/>
<text x="52" y="342" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">3</text>
<text x="78" y="310" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Skills</text>
<text x="78" y="330" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" fill="#a78bfa">.claude/skills/&lt;name&gt;/SKILL.md</text>
<text x="78" y="352" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#cbd5e1">reusable manual + helper scripts</text>
<text x="78" y="374" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#475569">loaded: only when needed</text>
<!-- Card 4: Permissions (rose) -->
<rect x="20" y="410" width="440" height="118" rx="14" fill="url(#g-c4)" stroke="#f87171" stroke-width="1" stroke-opacity="0.3"/>
<rect x="20" y="418" width="4" height="102" rx="2" fill="#f87171"/>
<circle cx="52" cy="469" r="16" fill="#2a0e0e" stroke="#f87171" stroke-width="1.5" filter="url(#glow)"/>
<text x="52" y="474" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">4</text>
<text x="78" y="442" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Permissions</text>
<text x="78" y="462" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="12" fill="#f87171">.claude/settings.json</text>
<text x="78" y="484" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#cbd5e1">hard limits nobody can break</text>
<text x="78" y="506" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#475569">applied: always</text>
<!-- Captions -->
<text x="240" y="556" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">Same four ideas in every AI coding tool;</text>
<text x="240" y="578" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">only file names and folders differ.</text>
</svg>
