<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" aria-label="A main agent delegating tasks to four subagents, each with its own context and tools"><style>
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--d-text,#0f172a)}
.m{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--d-muted,#475569)}
.c{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:var(--d-text,#0f172a)}
.b{font-weight:650}
.ln{stroke:var(--d-line,#64748b);stroke-width:2;fill:none}
.acc{stroke:var(--d-acc,#0d9488);stroke-width:2.5;fill:none}
.f0{fill:var(--d-f0,#ffffff);stroke:var(--d-s0,#cbd5e1);stroke-width:1.5}
.f1{fill:var(--d-f1,#f0fdfa);stroke:var(--d-s1,#14b8a6);stroke-width:1.5}
.f2{fill:var(--d-f2,#eff6ff);stroke:var(--d-s2,#60a5fa);stroke-width:1.5}
.f3{fill:var(--d-f3,#fffbeb);stroke:var(--d-s3,#f59e0b);stroke-width:1.5}
.f4{fill:var(--d-f4,#f5f3ff);stroke:var(--d-s4,#a78bfa);stroke-width:1.5}
.f5{fill:var(--d-f5,#fef2f2);stroke:var(--d-s5,#f87171);stroke-width:1.5}
.f6{fill:var(--d-f6,#f8fafc);stroke:var(--d-s0,#cbd5e1);stroke-width:1.5}
.code{fill:var(--d-code,#0f172a)}
.ck{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#7dd3fc}
.cv{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#fde68a}
.cd{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#5eead4}
.cm{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#94a3b8;font-style:italic}
.cb{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#e2e8f0}
.ah{fill:var(--d-line,#64748b)}
.aa{fill:var(--d-acc,#0d9488)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aa"/></marker>
</defs><rect x="165" y="14" width="150" height="40" rx="20.0" class="f6"/><text x="240.0" y="39.95" class="t b" font-size="17" text-anchor="middle">You</text><line x1="240" y1="54" x2="240" y2="88" class="ln" marker-end="url(#ar)"/><rect x="70" y="90" width="340" height="84" rx="14" class="f1"/><text x="240" y="124" class="t b" font-size="16" text-anchor="middle">Main agent</text><text x="240" y="148" class="t" font-size="16" text-anchor="middle">talks to you, plans, delegates</text><rect x="30" y="250" width="200" height="96" rx="14" class="f2"/><text x="130" y="288" class="t b" font-size="15" text-anchor="middle">data-fetcher</text><text x="130" y="312" class="t" font-size="15" text-anchor="middle">downloads</text><text x="130" y="334" class="m" font-size="12.5" text-anchor="middle">own context · own tools</text><rect x="250" y="250" width="200" height="96" rx="14" class="f3"/><text x="350" y="288" class="t b" font-size="15" text-anchor="middle">data-qc</text><text x="350" y="312" class="t" font-size="15" text-anchor="middle">checks · read-only</text><text x="350" y="334" class="m" font-size="12.5" text-anchor="middle">own context · own tools</text><rect x="30" y="390" width="200" height="96" rx="14" class="f4"/><text x="130" y="428" class="t b" font-size="15" text-anchor="middle">climate-analyst</text><text x="130" y="452" class="t" font-size="15" text-anchor="middle">computes</text><text x="130" y="474" class="m" font-size="12.5" text-anchor="middle">own context · own tools</text><rect x="250" y="390" width="200" height="96" rx="14" class="f5"/><text x="350" y="428" class="t b" font-size="15" text-anchor="middle">results-reviewer</text><text x="350" y="452" class="t" font-size="15" text-anchor="middle">reviews · read-only</text><text x="350" y="474" class="m" font-size="12.5" text-anchor="middle">own context · own tools</text><path d="M 200 174 L 140 248" class="ln" marker-end="url(#ar)"/><path d="M 280 174 L 340 248" class="ln" marker-end="url(#ar)"/><path d="M 70 150 Q 12 150 12 300 L 12 420 Q 12 438 26 438" class="ln" stroke-dasharray="6 5" marker-end="url(#ar)"/><path d="M 410 150 Q 468 150 468 300 L 468 420 Q 468 438 454 438" class="ln" stroke-dasharray="6 5" marker-end="url(#ar)"/><text x="240" y="222" class="m" font-size="13.5" text-anchor="middle">task + file paths</text><text x="240" y="520" class="m" font-size="14" text-anchor="middle">Each subagent starts with an empty context</text><text x="240" y="542" class="m" font-size="14" text-anchor="middle">and returns only a short summary.</text></svg>
