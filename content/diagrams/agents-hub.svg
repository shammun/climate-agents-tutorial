<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" aria-label="A main agent delegating tasks to four subagents, each with its own context and tools">
<defs>
  <linearGradient id="g-main" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="g-you" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>
  <linearGradient id="g-blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0c2244"/>
  </linearGradient>
  <linearGradient id="g-amber" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3d2a0a"/><stop offset="100%" stop-color="#1a1000"/>
  </linearGradient>
  <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2d1b4e"/><stop offset="100%" stop-color="#1a0a30"/>
  </linearGradient>
  <linearGradient id="g-rose" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3d1a1a"/><stop offset="100%" stop-color="#1a0808"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#2dd4bf"/>
  </marker>
  <marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#475569"/>
  </marker>
</defs>
<rect width="480" height="560" fill="#0d1424" rx="16"/>
<!-- "You" pill -->
<rect x="165" y="14" width="150" height="40" rx="20" fill="url(#g-you)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="240" y="39" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">You</text>
<!-- Arrow You → Main (bright teal, glow) -->
<line x1="240" y1="54" x2="240" y2="88" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<!-- Main agent box — teal gradient, strong glow -->
<rect x="70" y="90" width="340" height="84" rx="16" fill="url(#g-main)" stroke="#2dd4bf" stroke-width="1.5" filter="url(#glow)"/>
<text x="240" y="124" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Main agent</text>
<text x="240" y="148" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14.5" fill="#cbd5e1" text-anchor="middle">talks to you, plans, delegates</text>
<!-- Label -->
<text x="240" y="224" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#475569" text-anchor="middle">task + file paths</text>
<!-- Arrows to data-fetcher and data-qc -->
<path d="M 200 174 L 140 248" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<path d="M 280 174 L 340 248" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<!-- Dashed side arrows to climate-analyst and results-reviewer -->
<path d="M 70 150 Q 12 150 12 300 L 12 420 Q 12 438 26 438" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arr-muted)"/>
<path d="M 410 150 Q 468 150 468 300 L 468 420 Q 468 438 454 438" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#arr-muted)"/>
<!-- data-fetcher (blue) -->
<rect x="30" y="250" width="200" height="96" rx="14" fill="url(#g-blue)" stroke="#38bdf8" stroke-width="1.5"/>
<text x="130" y="287" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14.5" font-weight="700" fill="#f1f5f9" text-anchor="middle">data-fetcher</text>
<text x="130" y="309" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8" text-anchor="middle">downloads</text>
<text x="130" y="329" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">own context · own tools</text>
<!-- data-qc (amber, read-only) -->
<rect x="250" y="250" width="200" height="96" rx="14" fill="url(#g-amber)" stroke="#f59e0b" stroke-width="1.5"/>
<text x="350" y="287" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14.5" font-weight="700" fill="#f1f5f9" text-anchor="middle">data-qc</text>
<text x="350" y="309" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8" text-anchor="middle">checks · read-only</text>
<text x="350" y="329" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">own context · own tools</text>
<rect x="296" y="254" width="62" height="20" rx="10" fill="#3d1a1a" stroke="#f87171" stroke-width="1"/>
<text x="327" y="268" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="10" fill="#f87171" text-anchor="middle">read-only</text>
<!-- climate-analyst (purple) -->
<rect x="30" y="390" width="200" height="96" rx="14" fill="url(#g-purple)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="130" y="427" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14.5" font-weight="700" fill="#f1f5f9" text-anchor="middle">climate-analyst</text>
<text x="130" y="449" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8" text-anchor="middle">computes</text>
<text x="130" y="469" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">own context · own tools</text>
<!-- results-reviewer (rose, read-only) -->
<rect x="250" y="390" width="200" height="96" rx="14" fill="url(#g-rose)" stroke="#f87171" stroke-width="1.5"/>
<text x="350" y="427" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14.5" font-weight="700" fill="#f1f5f9" text-anchor="middle">results-reviewer</text>
<text x="350" y="449" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8" text-anchor="middle">reviews · read-only</text>
<text x="350" y="469" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">own context · own tools</text>
<rect x="296" y="394" width="62" height="20" rx="10" fill="#3d1a1a" stroke="#f87171" stroke-width="1"/>
<text x="327" y="408" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="10" fill="#f87171" text-anchor="middle">read-only</text>
<!-- Captions -->
<text x="240" y="522" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">Each subagent starts with an empty context</text>
<text x="240" y="542" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">and returns only a short summary.</text>
</svg>
