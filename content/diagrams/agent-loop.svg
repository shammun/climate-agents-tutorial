<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 720" role="img">
<title>The Agent Loop — how an AI agent thinks and acts</title>
<defs>
  <style>
    .card { cursor: pointer; }
    .tip { opacity: 0; pointer-events: none; transition: opacity .25s; }
    .card:hover .tip { opacity: 1; pointer-events: all; }
    @keyframes dashMove { to { stroke-dashoffset: -24; } }
    .flow { stroke-dasharray: 8 4; animation: dashMove 0.9s linear infinite; }
    .label-text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; }
  </style>
  <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#F9A825"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#1E88E5"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#43A047"/>
  </marker>
  <marker id="arrowCoral" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#F4511E"/>
  </marker>
  <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#00000018"/>
  </filter>
</defs>

<!-- Background -->
<rect width="620" height="720" fill="#FFFBF0" rx="24"/>

<!-- Header -->
<text x="310" y="44" text-anchor="middle" class="title-text" font-size="22" fill="#37474F">🔄 The Agent Loop</text>
<text x="310" y="66" text-anchor="middle" class="label-text" font-size="13" fill="#78909C">The model only decides — the loop runs the tools</text>

<!-- ═══ TASK pill ═══ -->
<g class="card" transform="translate(190,88)">
  <!-- shadow -->
  <rect x="5" y="5" width="240" height="72" rx="36" fill="#FFD54F"/>
  <!-- body -->
  <rect width="240" height="72" rx="36" fill="#FFF8E1" stroke="#F9A825" stroke-width="3" filter="url(#soft-shadow)"/>
  <text x="120" y="28" text-anchor="middle" class="title-text" font-size="16" fill="#E65100">🎯 Task</text>
  <text x="120" y="46" text-anchor="middle" class="label-text" font-size="11" fill="#6D4C41">Your request or goal</text>
  <text x="120" y="61" text-anchor="middle" class="label-text" font-size="10" fill="#8D6E63">e.g. Analyze SST anomalies for 2023</text>
  <!-- tooltip -->
  <g class="tip">
    <rect x="-20" y="78" width="280" height="44" rx="10" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
    <text x="120" y="97" text-anchor="middle" class="label-text" font-size="11" fill="#5D4037">💡 Can be text, a file path,</text>
    <text x="120" y="112" text-anchor="middle" class="label-text" font-size="11" fill="#5D4037">or a whole project brief</text>
  </g>
</g>

<!-- Arrow: Task → Model -->
<line x1="310" y1="168" x2="310" y2="196" stroke="#F9A825" stroke-width="2.5" class="flow" marker-end="url(#arrowAmber)"/>

<!-- ═══ MODEL box ═══ -->
<g class="card" transform="translate(90,200)">
  <!-- shadow -->
  <rect x="6" y="6" width="440" height="148" rx="22" fill="#90CAF9"/>
  <!-- body -->
  <rect width="440" height="148" rx="22" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3" filter="url(#soft-shadow)"/>
  <text x="220" y="34" text-anchor="middle" class="title-text" font-size="18" fill="#0D47A1">🧠 Model (LLM)</text>
  <text x="220" y="58" text-anchor="middle" class="label-text" font-size="12" fill="#1565C0">reads: instructions + task + ALL tool results so far</text>
  <text x="220" y="78" text-anchor="middle" class="label-text" font-size="12" fill="#1565C0">decides: which tool to call next</text>
  <text x="220" y="98" text-anchor="middle" class="label-text" font-size="12" fill="#1565C0">or: writes final answer when finished</text>
  <!-- divider -->
  <line x1="30" y1="112" x2="410" y2="112" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="220" y="132" text-anchor="middle" class="label-text" font-size="11" fill="#42A5F5" font-style="italic">⚠ The model never runs tools — it only decides</text>
  <!-- tooltip -->
  <g class="tip">
    <rect x="10" y="154" width="420" height="50" rx="10" fill="#E8F4FD" stroke="#1E88E5" stroke-width="1.5"/>
    <text x="220" y="174" text-anchor="middle" class="label-text" font-size="11" fill="#0D47A1">💡 Context window grows with each tool call result.</text>
    <text x="220" y="191" text-anchor="middle" class="label-text" font-size="11" fill="#0D47A1">The harness (Claude Code) executes every tool call.</text>
  </g>
</g>

<!-- Arrow: Model → Tool Runner (curved right) -->
<path d="M 530,310 C 580,310 580,420 530,420" fill="none" stroke="#43A047" stroke-width="2.5" class="flow" marker-end="url(#arrowGreen)"/>
<text x="590" y="352" text-anchor="middle" class="label-text" font-size="11" fill="#2E7D32" transform="rotate(-90,590,360)">asks for a tool</text>

<!-- ═══ TOOL RUNNER box ═══ -->
<g class="card" transform="translate(330,420)">
  <!-- shadow -->
  <rect x="5" y="5" width="244" height="148" rx="20" fill="#A5D6A7"/>
  <!-- body -->
  <rect width="244" height="148" rx="20" fill="#E8F5E9" stroke="#43A047" stroke-width="3" filter="url(#soft-shadow)"/>
  <text x="122" y="30" text-anchor="middle" class="title-text" font-size="16" fill="#1B5E20">🔧 Tool Runner</text>
  <text x="122" y="52" text-anchor="middle" class="label-text" font-size="11" fill="#2E7D32">• read / write files</text>
  <text x="122" y="68" text-anchor="middle" class="label-text" font-size="11" fill="#2E7D32">• run bash scripts</text>
  <text x="122" y="84" text-anchor="middle" class="label-text" font-size="11" fill="#2E7D32">• search the web</text>
  <text x="122" y="100" text-anchor="middle" class="label-text" font-size="11" fill="#2E7D32">• download climate data</text>
  <line x1="20" y1="112" x2="224" y2="112" stroke="#A5D6A7" stroke-width="1.5"/>
  <text x="122" y="130" text-anchor="middle" class="label-text" font-size="10" fill="#66BB6A" font-style="italic">returns result to model</text>
  <!-- tooltip -->
  <g class="tip">
    <rect x="-80" y="154" width="320" height="52" rx="10" fill="#F1F8E9" stroke="#43A047" stroke-width="1.5"/>
    <text x="82" y="173" text-anchor="middle" class="label-text" font-size="10" fill="#1B5E20">💡 bash · read_file · write_file</text>
    <text x="82" y="189" text-anchor="middle" class="label-text" font-size="10" fill="#1B5E20">python · search_web · download · sql_query</text>
  </g>
</g>

<!-- Arrow: Tool Runner → Model (curved left back) -->
<path d="M 330,480 C 280,480 280,370 330,340" fill="none" stroke="#1E88E5" stroke-width="2.5" class="flow" marker-end="url(#arrowBlue)"/>
<text x="258" y="420" text-anchor="middle" class="label-text" font-size="11" fill="#1565C0">result</text>

<!-- Arrow: Model → Final Answer (down left) -->
<line x1="200" y1="348" x2="200" y2="540" stroke="#F4511E" stroke-width="2.5" class="flow" marker-end="url(#arrowCoral)"/>
<text x="172" y="450" text-anchor="middle" class="label-text" font-size="11" fill="#BF360C" transform="rotate(-90,172,460)">done ✓</text>

<!-- ═══ FINAL ANSWER box ═══ -->
<g class="card" transform="translate(50,544)">
  <!-- shadow -->
  <rect x="5" y="5" width="260" height="110" rx="20" fill="#FFAB91"/>
  <!-- body -->
  <rect width="260" height="110" rx="20" fill="#FFF3E0" stroke="#F4511E" stroke-width="3" filter="url(#soft-shadow)"/>
  <text x="130" y="30" text-anchor="middle" class="title-text" font-size="16" fill="#BF360C">✅ Final Answer</text>
  <text x="130" y="52" text-anchor="middle" class="label-text" font-size="11" fill="#E64A19">• returned to the caller</text>
  <text x="130" y="68" text-anchor="middle" class="label-text" font-size="11" fill="#E64A19">• the agent stops here</text>
  <text x="130" y="84" text-anchor="middle" class="label-text" font-size="11" fill="#E64A19">• working steps stay private</text>
  <!-- tooltip -->
  <g class="tip">
    <rect x="0" y="116" width="260" height="44" rx="10" fill="#FBE9E7" stroke="#F4511E" stroke-width="1.5"/>
    <text x="130" y="136" text-anchor="middle" class="label-text" font-size="11" fill="#BF360C">💡 Loop ends when model outputs</text>
    <text x="130" y="151" text-anchor="middle" class="label-text" font-size="11" fill="#BF360C">text instead of a tool call</text>
  </g>
</g>

<!-- Did you know callout -->
<g transform="translate(340,580)">
  <rect width="220" height="64" rx="14" fill="#FCE4EC" stroke="#E91E63" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="110" y="20" text-anchor="middle" class="title-text" font-size="11" fill="#880E4F">🌟 Did you know?</text>
  <text x="110" y="37" text-anchor="middle" class="label-text" font-size="10" fill="#AD1457">GPT-4 can call 10+ tools in a</text>
  <text x="110" y="52" text-anchor="middle" class="label-text" font-size="10" fill="#AD1457">single agent run automatically!</text>
</g>

<!-- Caption -->
<text x="310" y="690" text-anchor="middle" class="label-text" font-size="12" fill="#78909C" font-style="italic">The loop repeats until the model writes its final answer.</text>
<text x="310" y="708" text-anchor="middle" class="label-text" font-size="11" fill="#90A4AE" font-style="italic">Hover each card to learn more.</text>
</svg>
