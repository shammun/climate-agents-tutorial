<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" width="480" height="540" role="img" aria-label="The agent loop: the model reads the task, asks for a tool, the loop runs it and returns the result, until the model gives a final answer">
<defs>
  <linearGradient id="g-model" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0d9488"/><stop offset="100%" stop-color="#0891b2"/>
  </linearGradient>
  <linearGradient id="g-tool" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0c2244"/>
  </linearGradient>
  <linearGradient id="g-final" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#92400e"/><stop offset="100%" stop-color="#78350f"/>
  </linearGradient>
  <linearGradient id="g-task" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#2dd4bf"/>
  </marker>
  <marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#475569"/>
  </marker>
</defs>
<rect width="480" height="540" fill="#0d1424" rx="16"/>
<!-- Task pill -->
<rect x="150" y="20" width="180" height="40" rx="20" fill="url(#g-task)" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="240" y="45" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Task</text>
<!-- Arrow: Task → Model -->
<line x1="240" y1="60" x2="240" y2="98" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<!-- Model (LLM) box — centrepiece with glow -->
<rect x="60" y="100" width="360" height="118" rx="16" fill="url(#g-model)" stroke="#2dd4bf" stroke-width="1.5" filter="url(#glow)"/>
<text x="240" y="133" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Model (LLM)</text>
<text x="240" y="156" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14.5" fill="#cbd5e1" text-anchor="middle">reads: instructions + task</text>
<text x="240" y="176" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14.5" fill="#cbd5e1" text-anchor="middle">+ every tool result so far</text>
<text x="240" y="196" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14.5" fill="#cbd5e1" text-anchor="middle">decides the next step</text>
<!-- Arrow: Model → Loop tool -->
<path d="M 360 218 L 360 280" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<text x="368" y="253" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="start">asks for a tool</text>
<!-- Loop runs the tool box -->
<rect x="250" y="282" width="210" height="104" rx="14" fill="url(#g-tool)" stroke="#38bdf8" stroke-width="1.5"/>
<text x="355" y="314" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14.5" font-weight="700" fill="#f1f5f9" text-anchor="middle">Loop runs the tool</text>
<text x="355" y="336" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8" text-anchor="middle">read file · run script</text>
<text x="355" y="356" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#94a3b8" text-anchor="middle">search · download</text>
<!-- Loop-back curved arrow — neon circuit trace -->
<path d="M 460 334 Q 478 334 478 260 L 478 170 Q 478 157 432 157" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arr-teal)" filter="url(#glow)"/>
<text x="470" y="210" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="end">result</text>
<!-- "done" branch left → Final answer -->
<path d="M 120 218 L 120 420" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr-muted)"/>
<text x="128" y="300" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="start">done</text>
<!-- Final answer — amber/gold -->
<rect x="30" y="422" width="180" height="66" rx="16" fill="url(#g-final)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="120" y="451" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="14.5" font-weight="700" fill="#fde68a" text-anchor="middle">Final answer</text>
<text x="120" y="473" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#fcd34d" text-anchor="middle">returned to the caller</text>
<!-- Caption -->
<text x="240" y="522" font-family="Inter,system-ui,-apple-system,sans-serif" font-size="13.5" fill="#475569" text-anchor="middle">The loop repeats until the model gives a final answer.</text>
</svg>
