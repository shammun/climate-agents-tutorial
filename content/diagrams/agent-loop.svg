<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" width="480" height="540" role="img" aria-label="The agent loop: the model reads the task, asks for a tool, the loop runs it and returns the result, until the model gives a final answer"><style>
.t{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--d-text,#0f172a)}
.m{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:var(--d-muted,#475569)}
.c{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;fill:var(--d-text,#0f172a)}
.b{font-weight:650}
.ln{stroke:var(--d-line,#64748b);stroke-width:2;fill:none}
.acc{stroke:var(--d-acc,#0d9488);stroke-width:2.5;fill:none}
.f0{fill:var(--d-f0,#ffffff);stroke:var(--d-s0,#cbd5e1);stroke-width:1.5}
.f1{fill:var(--d-f1,#f0fdfa);stroke:var(--d-s1,#14b8a6);stroke-width:1.5}
.f2{fill:var(--d-f2,#eff6ff);stroke:var(--d-s2,#60a5fa);stroke-width:1.5}
.f3{fill:var(--d-f3,#fffbeb);stroke:var(--d-s3,#f59e0b);stroke-width:1.5}
.f4{fill:var(--d-f4,#f5f3ff);stroke:var(--d-s4,#a78bfa);stroke-width:1.5}
.f5{fill:var(--d-f5,#fef2f2);stroke:var(--d-s5,#f87171);stroke-width:1.5}
.f6{fill:var(--d-f6,#f8fafc);stroke:var(--d-s0,#cbd5e1);stroke-width:1.5}
.code{fill:var(--d-code,#0f172a)}
.ck{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#7dd3fc}
.cv{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#fde68a}
.cd{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#5eead4}
.cm{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#94a3b8;font-style:italic}
.cb{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#e2e8f0}
.ah{fill:var(--d-line,#64748b)}
.aa{fill:var(--d-acc,#0d9488)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aa"/></marker>
</defs><rect x="150" y="16" width="180" height="40" rx="20.0" class="f6"/><text x="240.0" y="41.95" class="t b" font-size="17" text-anchor="middle">Task</text><line x1="240" y1="56" x2="240" y2="96" class="ln" marker-end="url(#ar)"/><rect x="60" y="98" width="360" height="118" rx="14" class="f1"/><text x="240" y="132" class="t b" font-size="16" text-anchor="middle">Model (LLM)</text><text x="240" y="154" class="t" font-size="16" text-anchor="middle">reads: instructions + task</text><text x="240" y="176" class="t" font-size="16" text-anchor="middle">+ every tool result so far</text><text x="240" y="198" class="t" font-size="16" text-anchor="middle">decides the next step</text><path d="M 360 216 L 360 280" class="acc" marker-end="url(#aa)"/><text x="372" y="254" class="m" font-size="14" text-anchor="start">asks for a tool</text><rect x="250" y="282" width="210" height="104" rx="14" class="f2"/><text x="355" y="314" class="t b" font-size="15" text-anchor="middle">Loop runs the tool</text><text x="355" y="336" class="t" font-size="15" text-anchor="middle">read file · run script</text><text x="355" y="358" class="t" font-size="15" text-anchor="middle">search · download</text><path d="M 460 334 Q 478 334 478 260 L 478 170 Q 478 157 432 157" class="acc" marker-end="url(#aa)"/><text x="472" y="196" class="m" font-size="14" text-anchor="end">result</text><path d="M 120 216 L 120 420" class="ln" marker-end="url(#ar)"/><text x="132" y="300" class="m" font-size="14" text-anchor="start">done</text><rect x="30" y="422" width="180" height="64" rx="14" class="f3"/><text x="120" y="450" class="t b" font-size="15" text-anchor="middle">Final answer</text><text x="120" y="471" class="t" font-size="15" text-anchor="middle">returned to the caller</text><text x="240" y="520" class="m" font-size="14" text-anchor="middle">The loop repeats until the model gives a final answer.</text></svg>
